<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테니스 점수판 (Tennis Scoreboard)</title>
  <style>
    /* 기본적인 스타일 설정 */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
    }
    .modal, .confirm-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .active { font-weight: bold; color: yellow; }
    .role-badge { display: none; }
    .role-badge.visible { display: inline-block; background: red; color: white; padding: 2px 4px; }
  </style>
</head>
<body>

  <!-- 미인증 접근 안내 -->
  <div id="unauthorized-access" style="display: none;">
    <h2>허용되지 않은 도메인입니다.</h2>
  </div>

  <!-- 오디오/비디오 요소 (WakeLock 및 오디오용) -->
  <video id="wakelock-video" style="display:none;" playsinline muted></video>
  <audio id="silent-audio" style="display:none;"></audio>

  <!-- 메인 화면 버튼/컨트롤 영역 -->
  <div>
    <button id="btn-settings">설정</button>
    <button id="btn-toggle-serve">SERVE: TEAM A</button>
    <button id="fs-overlay" onclick="startFullscreenApp()">전체화면 시작</button>
  </div>

  <!-- 점수판 표시 영역 -->
  <div id="scoreboard">
    <div id="card-team-a">
      <h2 id="disp-players-a">Team A</h2>
      <div>세트: <span id="sets-a">0</span> / 게임: <span id="games-a">0</span> / 포인트: <span id="points-a">0</span></div>
      <span id="serve-a">SERVE</span> <span id="arrow-a">◀</span>
    </div>
    <div id="card-team-b">
      <h2 id="disp-players-b">Team B</h2>
      <div>세트: <span id="sets-b">0</span> / 게임: <span id="games-b">0</span> / 포인트: <span id="points-b">0</span></div>
      <span id="serve-b">SERVE</span> <span id="arrow-b">▶</span>
    </div>
  </div>

  <!-- 코트 라벨 및 선수 위치 마커 -->
  <div id="court-container">
    <div id="side-left-bg"></div>
    <div id="side-right-bg"></div>
    <span id="label-left">TEAM A</span>
    <span id="label-right">TEAM B</span>

    <div id="pm-a1" class="player-marker"></div>
    <div id="pm-a2" class="player-marker"></div>
    <div id="pm-b1" class="player-marker"></div>
    <div id="pm-b2" class="player-marker"></div>
    <div id="target-box"></div>
  </div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal">
    <div style="background:#fff; color:#000; padding: 20px; max-width: 400px; margin: auto;">
      <h3>게임 설정</h3>
      <label>방식: 
        <select id="set-type" onchange="togglePlayerInputs()">
          <option value="doubles">복식</option>
          <option value="singles">단식</option>
        </select>
      </label><br>
      <label>선공 팀: <select id="set-first-serve"><option value="A">A팀</option><option value="B">B팀</option></select></label><br>
      <label>승리 세트 수: <input id="set-sets" type="number" value="3"></label><br>
      <label>세트당 게임 수: <input id="set-games" type="number" value="6"></label><br>
      <label>듀스 규칙: <select id="set-deuce"><option value="ad">AD</option><option value="no-ad">No-AD</option></select></label><br>
      <label>코트 변경: <select id="set-court"><option value="manual">수동</option><option value="auto">자동</option></select></label><br>
      <label>서버 안내: <input id="set-announce-server" value="3000"></label><br>
      
      <h4>선수 명단</h4>
      <input id="p-a1" placeholder="팀A 선수1"><br>
      <input id="p-a2" placeholder="팀A 선수2"><br>
      <input id="p-b1" placeholder="팀B 선수1"><br>
      <input id="p-b2" placeholder="팀B 선수2"><br>

      <h4>스외이프 설정</h4>
      <input id="swipe-up" value="right_score"><br>
      <input id="swipe-down" value="left_score"><br>
      <input id="swipe-left" value="court_change"><br>
      <input id="swipe-right" value="undo"><br>

      <h4>미디어키 설정</h4>
      <input id="media-next" value="right_score"><br>
      <input id="media-prev" value="left_score"><br>
      <input id="media-pause" value="undo"><br>
      <input id="media-play" value="court_change"><br>

      <button id="btn-save-settings">저장</button>
      <button id="btn-close-settings">닫기</button>
    </div>
  </div>

  <!-- 커스텀 확인 모달 -->
  <div id="custom-confirm-modal" class="confirm-modal">
    <div style="background:#fff; color:#000; padding:20px;">
      <p id="confirm-message"></p>
      <button id="btn-confirm-yes">예</button>
      <button id="btn-confirm-no">아니오</button>
    </div>
  </div>

  <!-- 자바스크립트 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
