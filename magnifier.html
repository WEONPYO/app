<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>돋보기 앱</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      background: rgba(20, 20, 20, 0.95);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 14px;
      min-width: 70px;
      color: #ccc;
    }
    select, input[type="range"], button {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }
    select {
      flex: 1;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #0a84ff;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-weight: bold;
      text-align: center;
      background: #333;
      border: none;
      cursor: pointer;
    }
    .btn-active {
      background: #0a84ff;
    }
    .btn-capture {
      background: #34c759;
      color: #fff;
      font-size: 16px;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <div class="row">
      <label for="cameraSelect">카메라</label>
      <select id="cameraSelect"></select>
    </div>

    <div class="row">
      <label for="zoomRange">확대 <span id="zoomVal">1x</span></label>
      <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1">
    </div>

    <div class="row" id="focusDistanceRow" style="display: none;">
      <label for="focusRange">초점 거리</label>
      <input type="range" id="focusRange" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="row">
      <label>초점 모드</label>
      <div class="btn-group">
        <button id="btnFocusAuto" class="btn btn-active">자동</button>
        <button id="btnFocusManual" class="btn">수동</button>
      </div>
    </div>

    <div class="row">
      <button id="btnCapture" class="btn btn-capture">📷 사진 촬영 및 저장</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const cameraSelect = document.getElementById('cameraSelect');
    const zoomRange = document.getElementById('zoomRange');
    const zoomVal = document.getElementById('zoomVal');
    const focusRange = document.getElementById('focusRange');
    const focusDistanceRow = document.getElementById('focusDistanceRow');
    const btnFocusAuto = document.getElementById('btnFocusAuto');
    const btnFocusManual = document.getElementById('btnFocusManual');
    const btnCapture = document.getElementById('btnCapture');
    const canvas = document.getElementById('canvas');

    let currentStream = null;
    let trackCapabilities = null;

    // LocalStorage 설정 로드
    const settings = JSON.parse(localStorage.getItem('magnifier_settings')) || {
      deviceId: '',
      zoom: 1,
      focusMode: 'continuous',
      focusDistance: 0.5
    };

    function saveSettings() {
      localStorage.setItem('magnifier_settings', JSON.stringify(settings));
    }

    // 카메라 목록 조회
    async function getCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      
      cameraSelect.innerHTML = '';
      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `카메라 ${index + 1}`;
        if (device.deviceId === settings.deviceId) {
          option.selected = true;
        }
        cameraSelect.appendChild(option);
      });

      if (!settings.deviceId && videoDevices.length > 0) {
        // 기본값: 후면 카메라 우선 선택
        const backCam = videoDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
        settings.deviceId = backCam ? backCam.deviceId : videoDevices[0].deviceId;
        cameraSelect.value = settings.deviceId;
      }
    }

    // 스트림 시작
    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        const track = currentStream.getVideoTracks()[0];
        trackCapabilities = track.getCapabilities ? track.getCapabilities() : {};

        // 확대 기능 지원 여부 확인
        if (trackCapabilities.zoom) {
          zoomRange.min = trackCapabilities.zoom.min;
          zoomRange.max = trackCapabilities.zoom.max;
          zoomRange.step = trackCapabilities.zoom.step;
          zoomRange.value = Math.min(Math.max(settings.zoom, trackCapabilities.zoom.min), trackCapabilities.zoom.max);
          applyZoom(zoomRange.value);
        }

        // 초점 모드 제어 지원여부 확인
        if (trackCapabilities.focusMode) {
          applyFocusMode(settings.focusMode);
        } else {
          focusDistanceRow.style.display = 'none';
        }

      } catch (err) {
        console.error("카메라 접근 실패:", err);
      }
    }

    // 확대 적용
    function applyZoom(value) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities.zoom) {
        track.applyConstraints({ advanced: [{ zoom: parseFloat(value) }] });
        zoomVal.textContent = `${parseFloat(value).toFixed(1)}x`;
        settings.zoom = value;
        saveSettings();
      }
    }

    // 초점 모드 적용 (자동/수동)
    function applyFocusMode(mode) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (!trackCapabilities.focusMode) return;

      const constraints = { advanced: [] };

      if (mode === 'manual' && trackCapabilities.focusMode.includes('manual')) {
        constraints.advanced.push({ focusMode: 'manual' });
        if (trackCapabilities.focusDistance) {
          focusRange.min = trackCapabilities.focusDistance.min;
          focusRange.max = trackCapabilities.focusDistance.max;
          focusRange.step = trackCapabilities.focusDistance.step;
          focusRange.value = settings.focusDistance;
          constraints.advanced[0].focusDistance = parseFloat(settings.focusDistance);
        }
        focusDistanceRow.style.display = 'flex';
        btnFocusManual.classList.add('btn-active');
        btnFocusAuto.classList.remove('btn-active');
      } else {
        constraints.advanced.push({ focusMode: 'continuous' });
        focusDistanceRow.style.display = 'none';
        btnFocusAuto.classList.add('btn-active');
        btnFocusManual.classList.remove('btn-active');
      }

      track.applyConstraints(constraints);
      settings.focusMode = mode;
      saveSettings();
    }

    // 수동 초점 거리 적용
    function applyFocusDistance(value) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities.focusDistance) {
        track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(value) }] });
        settings.focusDistance = value;
        saveSettings();
      }
    }

    // 사진 촬영 및 다운로드
    function capturePhoto() {
      if (!video.videoWidth) return;
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      const now = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      link.download = `magnifier_${now}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    // 이벤트 리스너 설정
    cameraSelect.addEventListener('change', (e) => {
      settings.deviceId = e.target.value;
      saveSettings();
      startCamera(settings.deviceId);
    });

    zoomRange.addEventListener('input', (e) => applyZoom(e.target.value));
    focusRange.addEventListener('input', (e) => applyFocusDistance(e.target.value));

    btnFocusAuto.addEventListener('click', () => applyFocusMode('continuous'));
    btnFocusManual.addEventListener('click', () => applyFocusMode('manual'));
    btnCapture.addEventListener('click', capturePhoto);

    // 초기화
    async function init() {
      await getCameras();
      await startCamera(settings.deviceId);
    }

    init();
  </script>
</body>
</html>
