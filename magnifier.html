<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>접사 & 플래시 돋보기 앱</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      background: rgba(20, 20, 20, 0.95);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 14px;
      min-width: 80px;
      color: #ccc;
    }
    select, input[type="range"], button {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }
    select {
      flex: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #0a84ff;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 10px;
      font-weight: bold;
      text-align: center;
      background: #333;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .btn-active {
      background: #0a84ff;
    }
    .btn-flash-active {
      background: #ffcc00;
      color: #000;
    }
    .btn-capture {
      background: #34c759;
      color: #fff;
      font-size: 16px;
      padding: 12px;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <!-- 카메라 선택 -->
    <div class="row">
      <label for="cameraSelect">카메라 선택</label>
      <select id="cameraSelect"></select>
    </div>

    <!-- 확대 / 축소 -->
    <div class="row">
      <label for="zoomRange">확대 <span id="zoomVal">1x</span></label>
      <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1">
    </div>

    <!-- 수동 초점 거리 제어 -->
    <div class="row" id="focusDistanceRow" style="display: none;">
      <label for="focusRange">초점 거리</label>
      <input type="range" id="focusRange" min="0" max="1" step="0.01" value="0.5">
    </div>

    <!-- 초점 모드 전환 & 플래시 버튼 -->
    <div class="row">
      <label>기능 제어</label>
      <div class="btn-group">
        <button id="btnFocusAuto" class="btn btn-active">자동 초점</button>
        <button id="btnFocusManual" class="btn">수동 초점</button>
        <button id="btnTorch" class="btn">💡 플래시</button>
      </div>
    </div>

    <!-- 사진 저장 버튼 -->
    <div class="row">
      <button id="btnCapture" class="btn btn-capture">📷 사진 촬영 및 저장</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const cameraSelect = document.getElementById('cameraSelect');
    const zoomRange = document.getElementById('zoomRange');
    const zoomVal = document.getElementById('zoomVal');
    const focusRange = document.getElementById('focusRange');
    const focusDistanceRow = document.getElementById('focusDistanceRow');
    const btnFocusAuto = document.getElementById('btnFocusAuto');
    const btnFocusManual = document.getElementById('btnFocusManual');
    const btnTorch = document.getElementById('btnTorch');
    const btnCapture = document.getElementById('btnCapture');
    const canvas = document.getElementById('canvas');

    let currentStream = null;
    let trackCapabilities = null;

    // 저장된 이전 설정값 로드
    const settings = JSON.parse(localStorage.getItem('magnifier_settings')) || {
      deviceId: '',
      zoom: 1,
      focusMode: 'continuous',
      focusDistance: 0.5,
      torch: false
    };

    function saveSettings() {
      localStorage.setItem('magnifier_settings', JSON.stringify(settings));
    }

    // 카메라 권한 취득 및 하드웨어 장치 목록 열거
    async function initCameraDevices() {
      try {
        const initStream = await navigator.mediaDevices.getUserMedia({ video: true });
        initStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        
        let preferredDeviceId = settings.deviceId;

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          
          let label = device.label || `카메라 ${index + 1}`;
          const lowerLabel = label.toLowerCase();
          
          if (lowerLabel.includes('macro') || lowerLabel.includes('접사') || lowerLabel.includes('close-up')) {
            label = `🔍 [접사] ${label}`;
            if (!settings.deviceId) {
              preferredDeviceId = device.deviceId;
            }
          }
          
          option.text = label;
          if (device.deviceId === preferredDeviceId) {
            option.selected = true;
          }
          cameraSelect.appendChild(option);
        });

        if (!preferredDeviceId && videoDevices.length > 0) {
          const backCam = videoDevices.find(d => 
            d.label.toLowerCase().includes('back') || 
            d.label.toLowerCase().includes('environment') ||
            d.label.toLowerCase().includes('0')
          );
          preferredDeviceId = backCam ? backCam.deviceId : videoDevices[0].deviceId;
        }

        settings.deviceId = preferredDeviceId;
        cameraSelect.value = preferredDeviceId;
        saveSettings();

      } catch (err) {
        console.error("카메라 장치 권한 요청 실패:", err);
      }
    }

    // 지정한 deviceId로 스트림 연결
    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 3840 },
          height: { ideal: 2160 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        const track = currentStream.getVideoTracks()[0];
        trackCapabilities = track.getCapabilities ? track.getCapabilities() : {};

        // 1. Zoom 제어
        if (trackCapabilities.zoom) {
          zoomRange.min = trackCapabilities.zoom.min;
          zoomRange.max = trackCapabilities.zoom.max;
          zoomRange.step = trackCapabilities.zoom.step || 0.1;
          const targetZoom = Math.min(Math.max(settings.zoom, trackCapabilities.zoom.min), trackCapabilities.zoom.max);
          zoomRange.value = targetZoom;
          applyZoom(targetZoom);
        } else {
          zoomRange.value = 1;
          zoomVal.textContent = "1.0x";
        }

        // 2. 초점 모드 제어
        if (trackCapabilities.focusMode) {
          applyFocusMode(settings.focusMode);
        } else {
          focusDistanceRow.style.display = 'none';
        }

        // 3. 플래시(Torch) 지원 제어
        if (trackCapabilities.torch) {
          btnTorch.style.display = 'block';
          applyTorch(settings.torch);
        } else {
          btnTorch.style.display = 'none';
        }

      } catch (err) {
        console.error("카메라 접근 실패:", err);
      }
    }

    // Zoom 적용
    function applyZoom(value) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities && trackCapabilities.zoom) {
        track.applyConstraints({ advanced: [{ zoom: parseFloat(value) }] })
          .then(() => {
            zoomVal.textContent = `${parseFloat(value).toFixed(1)}x`;
            settings.zoom = value;
            saveSettings();
          })
          .catch(err => console.warn("Zoom 비지원:", err));
      }
    }

    // 초점 모드 전환
    function applyFocusMode(mode) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (!trackCapabilities || !trackCapabilities.focusMode) return;

      const constraints = { advanced: [] };

      if (mode === 'manual' && trackCapabilities.focusMode.includes('manual')) {
        constraints.advanced.push({ focusMode: 'manual' });
        
        if (trackCapabilities.focusDistance) {
          focusRange.min = trackCapabilities.focusDistance.min;
          focusRange.max = trackCapabilities.focusDistance.max;
          focusRange.step = trackCapabilities.focusDistance.step || 0.01;
          focusRange.value = settings.focusDistance;
          constraints.advanced[0].focusDistance = parseFloat(settings.focusDistance);
        }
        
        focusDistanceRow.style.display = 'flex';
        btnFocusManual.classList.add('btn-active');
        btnFocusAuto.classList.remove('btn-active');
      } else {
        constraints.advanced.push({ focusMode: 'continuous' });
        focusDistanceRow.style.display = 'none';
        btnFocusAuto.classList.add('btn-active');
        btnFocusManual.classList.remove('btn-active');
      }

      track.applyConstraints(constraints)
        .then(() => {
          settings.focusMode = mode;
          saveSettings();
        })
        .catch(err => console.warn("Focus constraints 적용 실패:", err));
    }

    // 수동 초점 거리 조절
    function applyFocusDistance(value) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities && trackCapabilities.focusDistance) {
        track.applyConstraints({ 
          advanced: [{ focusMode: 'manual', focusDistance: parseFloat(value) }] 
        }).then(() => {
          settings.focusDistance = value;
          saveSettings();
        });
      }
    }

    // 플래시(Torch) 켜기/끄기 적용
    function applyTorch(enable) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities && trackCapabilities.torch) {
        track.applyConstraints({ advanced: [{ torch: enable }] })
          .then(() => {
            settings.torch = enable;
            if (enable) {
              btnTorch.classList.add('btn-flash-active');
            } else {
              btnTorch.classList.remove('btn-flash-active');
            }
            saveSettings();
          })
          .catch(err => console.warn("Torch 제어 실패:", err));
      }
    }

    // 사진 저장
    function capturePhoto() {
      if (!video.videoWidth) return;
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      const now = new Date();
      const timestamp = now.getFullYear().toString() +
        (now.getMonth() + 1).toString().padStart(2, '0') +
        now.getDate().toString().padStart(2, '0') + "_" +
        now.getHours().toString().padStart(2, '0') +
        now.getMinutes().toString().padStart(2, '0') +
        now.getSeconds().toString().padStart(2, '0');

      link.download = `magnifier_${timestamp}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    // 이벤트 리스너
    cameraSelect.addEventListener('change', (e) => {
      settings.deviceId = e.target.value;
      saveSettings();
      startCamera(settings.deviceId);
    });

    zoomRange.addEventListener('input', (e) => applyZoom(e.target.value));
    focusRange.addEventListener('input', (e) => applyFocusDistance(e.target.value));

    btnFocusAuto.addEventListener('click', () => applyFocusMode('continuous'));
    btnFocusManual.addEventListener('click', () => applyFocusMode('manual'));
    btnTorch.addEventListener('click', () => applyTorch(!settings.torch));
    btnCapture.addEventListener('click', capturePhoto);

    // 초기화
    async function init() {
      await initCameraDevices();
      if (settings.deviceId) {
        await startCamera(settings.deviceId);
      }
    }

    init();
  </script>
</body>
</html>
