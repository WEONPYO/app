<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : 아이폰 노치 및 안전 영역 완벽 대응 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스마트 돋보기 앱</title>
  <style>
    /* 기본 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 모바일 브라우저 주소창에 의한 하단 잘림을 방지하는 핵심 CSS */
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: fixed; /* 브라우저 뷰포트에 화면을 강제 고정 */
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    /* 앱 전체 래퍼 */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* 상단 헤더 바 */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .camera-select-wrapper {
      flex: 1;
      position: relative;
    }
    select {
      width: 100%;
      background: rgba(30, 30, 30, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      appearance: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    .icon-btn {
      background: rgba(30, 30, 30, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 메인 비디오 영역 */
    .video-container {
      flex: 1; /* 남은 화면 전체를 차지 */
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    /* 배율 뱃지 */
    .zoom-badge {
      position: absolute;
      top: calc(50px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffcc00;
      font-weight: bold;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      z-index: 5;
      pointer-events: none;
    }

    /* 하단 컨트롤 영역 (절대 잘리지 않도록 크기 고정) */
    .bottom-controls {
      flex-shrink: 0; /* 화면이 작아져도 축소되지 않음 */
      background: rgba(15, 15, 15, 0.98);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      /* 하단 제스처 영역(safe-area)만큼 패딩을 더 주어 겹치지 않게 함 */
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    /* 퀵 배율 버튼 */
    .quick-zoom-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .preset-btn {
      flex: 1;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .preset-btn.active {
      background: #0a84ff;
      color: #fff;
      border-color: #0a84ff;
    }

    /* 슬라이더 제어부 */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .slider-label {
      font-size: 12px;
      color: #bbb;
      min-width: 55px;
      font-weight: 500;
    }
    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      accent-color: #0a84ff;
    }

    /* 하단 액션 버튼 바 */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    
    .sub-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      gap: 2px;
      cursor: pointer;
    }
    .sub-btn .icon { font-size: 15px; }
    .sub-btn.active {
      background: rgba(10, 132, 255, 0.3);
      border-color: #0a84ff;
      color: #64d2ff;
    }
    .sub-btn.flash-on {
      background: rgba(255, 204, 0, 0.3);
      border-color: #ffcc00;
      color: #ffcc00;
    }

    /* 촬영(셔터) 버튼 */
    .shutter-btn-outer {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #fff;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
    }
    .shutter-btn-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s, background-color 0.1s;
    }
    .shutter-btn-outer:active .shutter-btn-inner {
      transform: scale(0.9);
      background: #e0e0e0;
    }

    .status-text {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: -4px;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <!-- 전체 화면을 고정하는 래퍼 -->
  <div class="app-wrapper">
    
    <!-- 상단 오버레이 헤더 -->
    <div class="top-bar">
      <div class="camera-select-wrapper">
        <select id="cameraSelect"></select>
      </div>
      <button id="btnScanCameras" class="icon-btn" title="카메라 재검색">🔄</button>
    </div>

    <!-- 비디오 화면 영역 -->
    <div class="video-container">
      <video id="webcam" autoplay playsinline></video>
      <div id="zoomBadge" class="zoom-badge">1.0x</div>
    </div>

    <!-- 하단 컨트롤 영역 -->
    <div class="bottom-controls">
      
      <!-- 퀵 배율 버튼 (1x ~ 20x) -->
      <div class="quick-zoom-bar">
        <button class="preset-btn active" data-zoom="1">1x</button>
        <button class="preset-btn" data-zoom="2">2x</button>
        <button class="preset-btn" data-zoom="5">5x</button>
        <button class="preset-btn" data-zoom="10">10x</button>
        <button class="preset-btn" data-zoom="15">15x</button>
        <button class="preset-btn" data-zoom="20">20x</button>
      </div>

      <!-- 배율 / 초점 조절 슬라이더 -->
      <div>
        <div class="slider-row">
          <span class="slider-label">확대(20x)</span>
          <div class="slider-container">
            <input type="range" id="zoomRange" min="1" max="20" step="0.1" value="1">
          </div>
        </div>
        
        <div class="slider-row" id="focusDistanceRow" style="display: none;">
          <span class="slider-label">접사거리</span>
          <div class="slider-container">
            <input type="range" id="focusRange" min="0" max="1" step="0.01" value="0.5">
          </div>
        </div>
      </div>

      <!-- 하단 메인 액션 바 -->
      <div class="action-bar">
        <!-- 초점 모드 버튼 -->
        <button id="btnFocusToggle" class="sub-btn">
          <span class="icon">🎯</span>
          <span id="focusModeText">자동초점</span>
        </button>

        <!-- 셔터 (사진 촬영) -->
        <div id="btnCapture" class="shutter-btn-outer" role="button" aria-label="사진 촬영">
          <div class="shutter-btn-inner"></div>
        </div>

        <!-- 플래시 버튼 -->
        <button id="btnTorch" class="sub-btn" style="display: none;">
          <span class="icon">💡</span>
          <span>플래시</span>
        </button>
      </div>

      <div id="statusInfo" class="status-text">카메라 초기화 중...</div>
    </div>

  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const cameraSelect = document.getElementById('cameraSelect');
    const btnScanCameras = document.getElementById('btnScanCameras');
    const zoomRange = document.getElementById('zoomRange');
    const zoomBadge = document.getElementById('zoomBadge');
    const focusRange = document.getElementById('focusRange');
    const focusDistanceRow = document.getElementById('focusDistanceRow');
    const btnFocusToggle = document.getElementById('btnFocusToggle');
    const focusModeText = document.getElementById('focusModeText');
    const btnTorch = document.getElementById('btnTorch');
    const btnCapture = document.getElementById('btnCapture');
    const statusInfo = document.getElementById('statusInfo');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const canvas = document.getElementById('canvas');

    let currentStream = null;
    let trackCapabilities = null;
    let currentZoom = 1;

    const settings = JSON.parse(localStorage.getItem('magnifier_settings_v3')) || {
      deviceId: '',
      zoom: 1,
      focusMode: 'continuous',
      focusDistance: 0.5,
      torch: false
    };

    function saveSettings() {
      localStorage.setItem('magnifier_settings_v3', JSON.stringify(settings));
    }

    async function scanAndPopulateCameras() {
      statusInfo.textContent = "카메라 장치 탐색 중...";
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        tempStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        cameraSelect.innerHTML = '';

        if (videoDevices.length === 0) {
          statusInfo.textContent = "카메라를 찾을 수 없습니다.";
          return;
        }

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          let label = device.label || `카메라 ${index + 1}`;
          const lower = label.toLowerCase();

          if (lower.includes('macro') || lower.includes('접사') || lower.includes('close-up')) {
            label = `🔍 [접사] ${label}`;
          } else if (lower.includes('back') || lower.includes('rear') || lower.includes('environment')) {
            label = `📷 [후면] ${label}`;
          } else if (lower.includes('front') || lower.includes('user')) {
            label = `👤 [전면] ${label}`;
          }

          option.text = label;
          if (device.deviceId === settings.deviceId) option.selected = true;
          cameraSelect.appendChild(option);
        });

        if (!settings.deviceId) {
          const backIndex = videoDevices.findIndex(d => 
            d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment') || d.label.toLowerCase().includes('0')
          );
          const targetIndex = backIndex !== -1 ? backIndex : 0;
          cameraSelect.selectedIndex = targetIndex;
          settings.deviceId = videoDevices[targetIndex].deviceId;
          saveSettings();
        }

        statusInfo.textContent = `연결된 카메라: ${videoDevices.length}개`;
      } catch (err) {
        console.error("탐색 실패:", err);
        statusInfo.textContent = "카메라 권한 필요";
      }
    }

    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 3840 },
          height: { ideal: 2160 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        const track = currentStream.getVideoTracks()[0];
        trackCapabilities = track.getCapabilities ? track.getCapabilities() : {};

        const initZoom = Math.min(Math.max(settings.zoom, 1), 20);
        setZoom(initZoom);

        if (trackCapabilities.focusMode) {
          applyFocusMode(settings.focusMode);
        } else {
          focusDistanceRow.style.display = 'none';
        }

        if (trackCapabilities.torch) {
          btnTorch.style.display = 'flex';
          applyTorch(settings.torch);
        } else {
          btnTorch.style.display = 'none';
        }
      } catch (err) {
        statusInfo.textContent = "카메라를 열 수 없습니다.";
      }
    }

    function setZoom(val) {
      const zoomVal = parseFloat(val);
      currentZoom = zoomVal;
      zoomRange.value = zoomVal;
      zoomBadge.textContent = `${zoomVal.toFixed(1)}x`;

      presetBtns.forEach(btn => {
        const pZoom = parseFloat(btn.dataset.zoom);
        if (Math.abs(pZoom - zoomVal) < 0.2) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];

      if (trackCapabilities && trackCapabilities.zoom) {
        const hwMax = trackCapabilities.zoom.max;
        const hwMin = trackCapabilities.zoom.min;
        const hwZoom = Math.min(Math.max(zoomVal, hwMin), hwMax);

        track.applyConstraints({ advanced: [{ zoom: hwZoom }] }).catch(e => {});

        if (zoomVal > hwMax) {
          const cssScale = zoomVal / hwMax;
          video.style.transform = `scale(${cssScale})`;
        } else {
          video.style.transform = `scale(1)`;
        }
      } else {
        video.style.transform = `scale(${zoomVal})`;
      }

      settings.zoom = zoomVal;
      saveSettings();
    }

    function applyFocusMode(mode) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (!trackCapabilities || !trackCapabilities.focusMode) return;

      const constraints = { advanced: [] };

      if (mode === 'manual' && trackCapabilities.focusMode.includes('manual')) {
        constraints.advanced.push({ focusMode: 'manual' });
        
        if (trackCapabilities.focusDistance) {
          focusRange.min = trackCapabilities.focusDistance.min;
          focusRange.max = trackCapabilities.focusDistance.max;
          focusRange.step = trackCapabilities.focusDistance.step || 0.01;
          focusRange.value = settings.focusDistance || trackCapabilities.focusDistance.min;
          constraints.advanced[0].focusDistance = parseFloat(focusRange.value);
        }
        
        focusDistanceRow.style.display = 'flex';
        btnFocusToggle.classList.add('active');
        focusModeText.textContent = "수동초점";
      } else {
        constraints.advanced.push({ focusMode: 'continuous' });
        focusDistanceRow.style.display = 'none';
        btnFocusToggle.classList.remove('active');
        focusModeText.textContent = "자동초점";
      }

      track.applyConstraints(constraints).then(() => {
        settings.focusMode = mode;
        saveSettings();
      }).catch(e => {});
    }

    function applyFocusDistance(value) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities && trackCapabilities.focusDistance) {
        track.applyConstraints({ 
          advanced: [{ focusMode: 'manual', focusDistance: parseFloat(value) }] 
        }).then(() => {
          settings.focusDistance = value;
          saveSettings();
        });
      }
    }

    function applyTorch(enable) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (trackCapabilities && trackCapabilities.torch) {
        track.applyConstraints({ advanced: [{ torch: enable }] }).then(() => {
          settings.torch = enable;
          if (enable) btnTorch.classList.add('flash-on');
          else btnTorch.classList.remove('flash-on');
          saveSettings();
        }).catch(e => {});
      }
    }

    function capturePhoto() {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      let scale = 1;
      if (trackCapabilities && trackCapabilities.zoom) {
        if (currentZoom > trackCapabilities.zoom.max) {
          scale = currentZoom / trackCapabilities.zoom.max;
        }
      } else {
        scale = currentZoom;
      }

      if (scale > 1) {
        const sw = canvas.width / scale;
        const sh = canvas.height / scale;
        const sx = (canvas.width - sw) / 2;
        const sy = (canvas.height - sh) / 2;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      const link = document.createElement('a');
      const now = new Date();
      const timestamp = now.getFullYear().toString() +
        (now.getMonth() + 1).toString().padStart(2, '0') +
        now.getDate().toString().padStart(2, '0') + "_" +
        now.getHours().toString().padStart(2, '0') +
        now.getMinutes().toString().padStart(2, '0') +
        now.getSeconds().toString().padStart(2, '0');

      link.download = `magnifier_${currentZoom.toFixed(1)}x_${timestamp}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    cameraSelect.addEventListener('change', (e) => {
      settings.deviceId = e.target.value;
      saveSettings();
      startCamera(settings.deviceId);
    });

    btnScanCameras.addEventListener('click', async () => {
      await scanAndPopulateCameras();
      if (cameraSelect.value) startCamera(cameraSelect.value);
    });

    zoomRange.addEventListener('input', (e) => setZoom(e.target.value));
    presetBtns.forEach(btn => btn.addEventListener('click', () => setZoom(btn.dataset.zoom)));
    focusRange.addEventListener('input', (e) => applyFocusDistance(e.target.value));
    btnFocusToggle.addEventListener('click', () => applyFocusMode(settings.focusMode === 'manual' ? 'continuous' : 'manual'));
    btnTorch.addEventListener('click', () => applyTorch(!settings.torch));
    btnCapture.addEventListener('click', capturePhoto);

    async function init() {
      await scanAndPopulateCameras();
      if (settings.deviceId) await startCamera(settings.deviceId);
    }
    
    init();
  </script>
</body>
</html>
