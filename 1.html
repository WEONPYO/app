<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 확인</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f6fa;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #3f449e;
    }
    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    /* 암호 통과 후 표시될 영역 */
    #success-content {
      display: none;
    }
  </style>
</head>
<body>

  <div id="login-card" class="container">
    <h2>보안 인증</h2>
    <p style="color: #666; font-size: 14px;">페이지에 접근하려면 비밀번호를 입력하세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">확인</button>
    <p id="errorMsg" class="error">비밀번호가 올바르지 않습니다.</p>
  </div>

  <div id="success-content" class="container">
    <h2 style="color: #2ecc71;">인증 성공!</h2>
    <p>다음 단계 내용이 여기에 표시됩니다.</p>
    <button onclick="location.reload()">처음으로</button>
  </div>
