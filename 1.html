<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애플워치 버튼 이벤트 수신기</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>애플워치 미디어 컨트롤러</h2>
    <p>아래 버튼을 눌러 오디오를 실행하면 애플워치 '지금 재생 중' 화면에 제어 버튼이 활성화됩니다.</p>
    
    <!-- 사용자 상호작용을 위해 필요한 무음/기본 오디오 -->
    <audio id="audio" loop src="https://www.w3schools.com/html/horse.mp3"></audio>
    
    <button id="startBtn">1. 서비스 시작하기</button>

    <div id="log">상태: 대기 중...</div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');

    // 웹 오디오 재생 시작 및 미디어 세션 등록
    startBtn.addEventListener('click', () => {
      audio.play().then(() => {
        log.innerText = "상태: 오디오 재생 중! 애플워치에서 이전/다음 버튼을 눌러보세요.";
        initMediaSession();
      }).catch(err => {
        log.innerText = "오디오 재생 실패: " + err;
      });
    });

    function initMediaSession() {
      // 브라우저가 Media Session API를 지원하는지 확인
      if ('mediaSession' in navigator) {

        // 애플워치 화면에 표시될 미디어 정보 등록
        navigator.mediaSession.metadata = new MediaMetadata({
          title: '웹 컨트롤러 모드',
          artist: '이벤트 수신 중...',
          album: 'HTML5 Media Session'
        });

        // 1. [이전곡] 버튼 눌렀을 때 실행될 이벤트
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          onPreviousTrackPressed();
        });

        // 2. [다음곡] 버튼 눌렀을 때 실행될 이벤트
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          onNextTrackPressed();
        });
      } else {
        log.innerText = "이 브라우저는 Media Session API를 지원하지 않습니다.";
      }
    }

    // --- 실행하고자 하는 특정 로직을 아래 함수에 작성하세요 ---

    function onPreviousTrackPressed() {
      const time = new Date().toLocaleTimeString();
      log.innerText = `[${time}] '이전곡' 이벤트 수신 완료!`;
      
      // TODO: 실행할 작업 작성 (예: 카운터 감소, 페이지 이전 항목 이동 등)
      document.body.style.backgroundColor = "#e0f7fa";
    }

    function onNextTrackPressed() {
      const time = new Date().toLocaleTimeString();
      log.innerText = `[${time}] '다음곡' 이벤트 수신 완료!`;
      
      // TODO: 실행할 작업 작성 (예: 카운터 증가, 페이지 다음 항목 이동 등)
      document.body.style.backgroundColor = "#fff3e0";
    }
  </script>
</body>
</html>
