<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배드민턴 서브 순서 카운터</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        /* 설정 영역 */
        .settings-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-row label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #495057;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            background-color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            color: #333;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #4c6ef5;
        }

        /* 점수판 */
        .scoreboard {
            display: flex;
            gap: 12px;
        }

        .team-card {
            flex: 1;
            background-color: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .team-card.serving {
            border-color: #4c6ef5;
            background-color: #edf2ff;
        }

        .team-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: #212529;
            margin: 4px 0;
        }

        .btn-score {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            background-color: #4c6ef5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(76, 110, 245, 0.2);
            transition: background-color 0.15s ease;
        }

        .btn-score:hover {
            background-color: #3b5bdb;
        }

        .btn-score:active {
            transform: scale(0.98);
        }

        /* 정보 표시 영역 */
        .status-card {
            background-color: #212529;
            color: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .status-title {
            font-size: 0.85rem;
            color: #adb5bd;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffec99;
        }

        /* 컨트롤 버튼 */
        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-control {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e9ecef;
            color: #495057;
            transition: background-color 0.15s ease;
        }

        .btn-control:hover {
            background-color: #dee2e6;
        }

        .btn-reset {
            background-color: #ffe3e3;
            color: #e03131;
        }

        .btn-reset:hover {
            background-color: #ffc9c9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>배드민턴 서브 순서 카운터</h1>

    <!-- 설정 영역 -->
    <div class="settings-card">
        <div class="setting-row">
            <label for="delaySelect">서브 콜 지연시간</label>
            <select id="delaySelect">
                <option value="3000" selected>3초</option>
                <option value="5000">5초</option>
                <option value="7000">7초</option>
            </select>
        </div>
        <div class="setting-row">
            <label for="targetScoreSelect">목표 점수 (코트체인지)</label>
            <select id="targetScoreSelect">
                <option value="11">11점 (6점 체인지)</option>
                <option value="21" selected>21점 (11점 체인지)</option>
                <option value="30">30점 (15점 체인지)</option>
            </select>
        </div>
    </div>

    <!-- 점수판 -->
    <div class="scoreboard">
        <!-- A팀 (왼쪽) -->
        <div class="team-card serving" id="teamACard">
            <div class="team-title" id="teamALabel">A팀 (왼쪽)</div>
            <div class="score-display" id="scoreA">0</div>
            <button class="btn-score" onclick="addScore('A')">+1</button>
        </div>

        <!-- B팀 (오른쪽) -->
        <div class="team-card" id="teamBCard">
            <div class="team-title" id="teamBLabel">B팀 (오른쪽)</div>
            <div class="score-display" id="scoreB">0</div>
            <button class="btn-score" onclick="addScore('B')">+1</button>
        </div>
    </div>

    <!-- 현재 안내 상태 -->
    <div class="status-card">
        <div class="status-title">다음 서브 순서</div>
        <div class="status-value" id="serveStatus">경기를 시작하세요</div>
    </div>

    <!-- 컨트롤 버튼 -->
    <div class="controls">
        <button class="btn-control" onclick="undoScore()">되돌리기</button>
        <button class="btn-control btn-reset" onclick="resetGame()">리셋</button>
    </div>
</div>

<script>
    // 경기 상태 변수
    let scoreA = 0;
    let scoreB = 0;
    let currentServer = 'A'; // 'A' 또는 'B'
    let courtSwapped = false;
    let history = [];
    let callTimer = null;

    // DOM 요소
    const scoreAEl = document.getElementById('scoreA');
    const scoreBEl = document.getElementById('scoreB');
    const teamACard = document.getElementById('teamACard');
    const teamBCard = document.getElementById('teamBCard');
    const teamALabel = document.getElementById('teamALabel');
    const teamBLabel = document.getElementById('teamBLabel');
    const serveStatusEl = document.getElementById('serveStatus');
    const delaySelect = document.getElementById('delaySelect');
    const targetScoreSelect = document.getElementById('targetScoreSelect');

    // 음성 합성 (TTS) 설정
    function speak(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 이전 음성 취소
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            
            if (callback) {
                utterance.onend = callback;
            }
            
            window.speechSynthesis.speak(utterance);
        }
    }

    // 득점 처리
    function addScore(team) {
        // 이전 상태 저장 (되돌리기용)
        history.push({
            scoreA,
            scoreB,
            currentServer,
            courtSwapped
        });

        // 득점자에게 서브권 부여
        currentServer = team;

        if (team === 'A') scoreA++;
        else scoreB++;

        updateUI();
        checkCourtChangeAndAnnounce();
    }

    // 코트 체인지 여부 확인 및 안내 로직
    function checkCourtChangeAndAnnounce() {
        if (callTimer) clearTimeout(callTimer);

        const targetScore = parseInt(targetScoreSelect.value);
        const changeThreshold = Math.ceil(targetScore / 2);
        const delay = parseInt(delaySelect.value);

        // 한 팀이라도 체인지 기준 점수에 도달했고, 아직 코트 체인지를 안 한 경우
        const needsCourtChange = !courtSwapped && (scoreA >= changeThreshold || scoreB >= changeThreshold);

        if (needsCourtChange) {
            courtSwapped = true;
            swapCourtLabels();

            // 1. "코트 체인지" 음성 안내
            speak("코트 체인지");

            // 2. 지연 시간 후 서브 순서 안내 및 음성 출력
            callTimer = setTimeout(() => {
                announceServe();
            }, delay);
        } else {
            // 코트 체인지가 아닌 경우 지연 시간 후 바로 서브 순서 안내
            callTimer = setTimeout(() => {
                announceServe();
            }, delay);
        }
    }

    // 서브 순서 계산 및 안내
    function announceServe() {
        const score = currentServer === 'A' ? scoreA : scoreB;
        const position = (score % 2 === 0) ? "오른쪽" : "왼쪽";
        
        // 실제 화면에 보이는 코트 위치에 맞게 팀 이름 표시
        let teamDisplay = "";
        if (!courtSwapped) {
            teamDisplay = currentServer === 'A' ? "A팀" : "B팀";
        } else {
            teamDisplay = currentServer === 'A' ? "A팀 (오른쪽)" : "B팀 (왼쪽)";
        }

        const message = `${teamDisplay} ${position} 서브`;
        serveStatusEl.textContent = message;
        speak(message);
    }

    // UI 업데이트 (점수 및 서브권 표시)
    function updateUI() {
        scoreAEl.textContent = scoreA;
        scoreBEl.textContent = scoreB;

        if (currentServer === 'A') {
            teamACard.classList.add('serving');
            teamBCard.classList.remove('serving');
        } else {
            teamBCard.classList.add('serving');
            teamACard.classList.remove('serving');
        }
    }

    // 코트 체인지시 화면 라벨 변경
    function swapCourtLabels() {
        if (courtSwapped) {
            teamALabel.textContent = "A팀 (오른쪽)";
            teamBLabel.textContent = "B팀 (왼쪽)";
        } else {
            teamALabel.textContent = "A팀 (왼쪽)";
            teamBLabel.textContent = "B팀 (오른쪽)";
        }
    }

    // 되돌리기
    function undoScore() {
        if (history.length === 0) return;
        if (callTimer) clearTimeout(callTimer);

        const lastState = history.pop();
        scoreA = lastState.scoreA;
        scoreB = lastState.scoreB;
        currentServer = lastState.currentServer;
        courtSwapped = lastState.courtSwapped;

        swapCourtLabels();
        updateUI();
        serveStatusEl.textContent = "득점 되돌림";
        window.speechSynthesis.cancel();
    }

    // 경기 리셋
    function resetGame() {
        if (callTimer) clearTimeout(callTimer);
        window.speechSynthesis.cancel();

        scoreA = 0;
        scoreB = 0;
        currentServer = 'A';
        courtSwapped = false;
        history = [];

        swapCourtLabels();
        updateUI();
        serveStatusEl.textContent = "경기를 시작하세요";
    }
</script>

</body>
</html>
