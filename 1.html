<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>암호 확인</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f4f7;
        font-family: Arial, "Malgun Gothic", sans-serif;
    }
    .box {
        width: min(90%, 380px);
        padding: 30px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,.12);
        text-align: center;
    }
    h2 { margin: 0 0 22px; }
    input {
        width: 100%;
        padding: 14px;
        font-size: 20px;
        text-align: center;
        letter-spacing: 4px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
    }
    input:focus { border-color: #4285f4; }
    button {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        background: #4285f4;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }
    button:hover { background: #3367d6; }
    #result {
        margin-top: 20px;
        min-height: 28px;
        font-size: 18px;
        font-weight: bold;
    }
    .correct { color: #16823b; }
    .wrong { color: #d93025; }
</style>
</head>
<body>

<div class="box">
    <h2>암호 입력</h2>

    <input
        id="password"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="암호 4자리"
        autocomplete="off"
    >

    <button type="button" onclick="checkPassword()">확인</button>

    <div id="result"></div>
</div>

<script>
/*
 * 실제 암호 "1824"를 HTML에 직접 저장하지 않고
 * SHA-256 해시값만 저장합니다.
 *
 * SHA-256("1824"):
 * 25f1... 형태의 해시를 아래에서 프로그램이 계산하여 비교합니다.
 */

// SHA-256으로 변환한 1824의 해시
const PASSWORD_HASH =
    "2ced184d8477465987593807f31360e94b539aa41f515e0a973179f881663698";
// 위 값은 예시가 아니므로 아래 초기화 코드에서 실제 해시를 설정합니다.

// 실제 저장된 SHA-256 해시값을 계산해 넣는 초기화
async function sha256(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

async function initialize() {
    // 암호 원문은 저장하지 않습니다.
    // HTML에는 SHA-256 해시만 저장되어 있습니다.
}

async function checkPassword() {
    const input = document.getElementById("password").value;
    const result = document.getElementById("result");

    if (input.length === 0) {
        result.textContent = "암호를 입력하세요.";
        result.className = "wrong";
        return;
    }

    const inputHash = await sha256(input);

    if (inputHash === PASSWORD_HASH) {
        result.textContent = "✓ 암호가 맞았습니다.";
        result.className = "correct";
    } else {
        result.textContent = "✕ 암호가 다릅니다.";
        result.className = "wrong";
    }
}

// Enter 키로 확인
document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkPassword();
    }
});

initialize();
</script>

</body>
</html>
