<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 확인</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f6fa;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0 5px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #4e54c8;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3f449e;
    }
    .msg {
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
      font-weight: bold;
    }
    .msg.error { color: #e74c3c; }
    .msg.success { color: #2ecc71; }

    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    #success-content { display: none; }
  </style>
</head>
<body>

  <!-- 1. 비밀번호 입력 영역 -->
  <div id="login-card" class="container">
    <h2>보안 인증</h2>
    <p style="color: #666; font-size: 14px;">비밀번호 4자리를 입력하세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">확인</button>
    <div id="statusMsg" class="msg"></div>
  </div>

  <!-- 2. 인증 성공 시 나타날 콘텐츠 영역 -->
  <div id="success-content" class="container">
    <h2 style="color: #2ecc71;">🔓 접근 승인됨</h2>
    <p>비밀번호가 확인되었습니다.<br>다음 단계 내용이 여기에 표시됩니다.</p>
    <button onclick="location.reload()" style="background-color: #718093;">다시 시도</button>
  </div>

  <script>
    // '1824'의 SHA-256 해시값
    const TARGET_HASH = "7a268e3790ecdc4119e0b8e66e7465f299863863433e2bfae498687b1c31405e";

    // 표준 Web Crypto API 기반 SHA-256 변환 함수
    async function getSha256(str) {
      const buffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 비밀번호 검증 처리 함수
    async function checkPassword() {
      const inputEl = document.getElementById('passwordInput');
      const cardEl = document.getElementById('login-card');
      const msgEl = document.getElementById('statusMsg');
      const inputVal = inputEl.value;

      if (!inputVal) {
        msgEl.className = "msg error";
        msgEl.innerText = "비밀번호를 입력해 주세요.";
        return;
      }

      // 입력된 비밀번호 해시 계산
      const inputHash = await getSha256(inputVal);

      if (inputHash === TARGET_HASH) {
        // [맞았을 때]
        msgEl.className = "msg success";
        msgEl.innerText = "비밀번호가 맞습니다! 이동 중...";
        inputEl.style.borderColor = "#2ecc71";

        setTimeout(() => {
          cardEl.style.display = 'none';
          document.getElementById('success-content').style.display = 'block';
        }, 600);

      } else {
        // [틀렸을 때]
        msgEl.className = "msg error";
        msgEl.innerText = "❌ 비밀번호가 올바르지 않습니다.";
        inputEl.style.borderColor = "#e74c3c";
        
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');

        inputEl.value = '';
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
