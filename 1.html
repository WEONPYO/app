<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tennis Scoreboard</title>
  <style>
    :root {
      --bg-color: #0c1911;
      --card-bg: #14281d;
      --team-a-color: #702963;
      --team-b-color: #006633;
      --team-a-court: #3b1935;
      --team-b-court: #0b3d22;
      --line-color: #ffffff;
      --accent-yellow: #ccff00;
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      touch-action: none;
    }

    #unauthorized-access {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      color: #ff4d4d;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      text-align: center;
    }

    #unauthorized-access h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    #unauthorized-access p {
      color: #ffffff;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    #fs-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    #fs-overlay h2 {
      color: var(--accent-yellow);
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    .btn-fullscreen-start {
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: var(--accent-yellow);
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
    }

    header {
      background-color: var(--card-bg);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #234733;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .header-btns { display: flex; gap: 6px; }

    .btn-icon {
      background: #1c3829;
      border: 1px solid #2e5941;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }

    .scoreboard {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
    }

    .team-card {
      flex: 1;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      overflow: hidden;
      transition: order 0.3s ease;
    }

    .team-card.team-a { background: linear-gradient(135deg, var(--team-a-color), #401438); }
    .team-card.team-b { background: linear-gradient(135deg, var(--team-b-color), #003319); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .team-info { display: flex; align-items: center; gap: 8px; }

    .team-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name { font-size: 1.1rem; font-weight: 800; }
    .player-names { font-size: 0.75rem; opacity: 0.85; }

    .court-arrow {
      font-size: 1rem;
      font-weight: 900;
      color: var(--accent-yellow);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -1px;
      border: 1px solid rgba(204, 255, 0, 0.4);
    }

    .sets-won {
      font-size: 1.5rem; font-weight: 900;
      background: rgba(0,0,0,0.4);
      padding: 2px 10px; border-radius: 6px;
    }

    .score-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
    }

    .games-score {
      font-size: 2.2rem;
      font-weight: 800;
      opacity: 0.8;
      position: absolute;
      left: 10px;
    }

    .point-score {
      font-size: 80cqh;
      font-weight: 900;
      text-shadow: 4px 4px 8px rgba(0,0,0,0.7);
      line-height: 1;
      letter-spacing: -2px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .serve-ball {
      display: inline-block;
      width: 10px; height: 10px;
      background-color: var(--accent-yellow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-yellow);
      visibility: hidden;
    }
    .serve-ball.active { visibility: visible; }

    .btn-score-up {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 3;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1.2fr 1fr;
      gap: 5px;
      padding: 0 6px 6px 6px;
    }

    .btn-action {
      background-color: #1c3829; color: white;
      border: 1px solid #2e5941;
      padding: 8px 0; border-radius: 6px;
      font-size: 0.72rem; font-weight: bold;
      cursor: pointer; text-align: center;
    }

    .btn-action.highlight {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .court-container {
      margin: 0 6px 8px 6px;
      background-color: #112217;
      border-radius: 10px;
      padding: 6px;
      position: relative;
      display: flex;
      aspect-ratio: 1.5 / 1;
      max-height: 290px;
      align-self: center;
      width: calc(100% - 12px);
    }

    .court-inner {
      flex: 1;
      border: 2px solid var(--line-color);
      position: relative;
      display: flex;
      overflow: hidden;
    }

    .court-side {
      position: absolute;
      top: 0; bottom: 0; width: 50%;
      transition: background-color 0.3s ease;
    }
    .court-side.left { left: 0; }
    .court-side.right { right: 0; }

    .bg-team-a { background-color: var(--team-a-court); }
    .bg-team-b { background-color: var(--team-b-court); }

    .net-line {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 4px; background-color: var(--line-color);
      transform: translateX(-50%); z-index: 3;
    }

    .singles-line-top {
      position: absolute; top: 15%; left: 0; right: 0;
      height: 2px; background-color: var(--line-color); z-index: 2;
    }
    .singles-line-bottom {
      position: absolute; bottom: 15%; left: 0; right: 0;
      height: 2px; background-color: var(--line-color); z-index: 2;
    }

    .service-line-left {
      position: absolute; left: 25%; top: 15%; bottom: 15%;
      width: 2px; background-color: var(--line-color); z-index: 2;
    }
    .service-line-right {
      position: absolute; right: 25%; top: 15%; bottom: 15%;
      width: 2px; background-color: var(--line-color); z-index: 2;
    }

    .center-service-line {
      position: absolute; top: 50%; left: 25%; right: 25%;
      height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }

    .hash-left {
      position: absolute; left: 0; top: 50%;
      width: 8px; height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }
    .hash-right {
      position: absolute; right: 0; top: 50%;
      width: 8px; height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }

    .side-label {
      position: absolute; font-size: 0.65rem; font-weight: bold;
      color: rgba(255,255,255,0.85); pointer-events: none; z-index: 4;
    }
    .side-label.left { left: 4px; top: 2px; }
    .side-label.right { right: 4px; top: 2px; }

    .target-service-box {
      position: absolute;
      width: 25%; height: 35%;
      background: rgba(204, 255, 0, 0.35);
      border: 2px dashed var(--accent-yellow);
      z-index: 4; pointer-events: none;
      transition: all 0.3s ease;
    }

    .player-marker {
      position: absolute;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.6rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      z-index: 5;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 85px;
    }

    .player-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .role-badge {
      font-size: 0.45rem;
      padding: 1px 3px;
      border-radius: 2px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      margin-top: 1px;
      font-weight: 800;
      display: none;
    }

    .role-badge.visible { display: inline-block; }

    .player-marker.server {
      background-color: var(--accent-yellow) !important;
      color: #000 !important;
      border: 1.5px solid #000;
      transform: translate(-50%, -50%) scale(1.05);
      z-index: 10;
      box-shadow: 0 0 8px var(--accent-yellow);
    }

    .player-marker.server .role-badge { background: #000; color: var(--accent-yellow); }

    .player-marker.receiver {
      border: 1.5px solid var(--accent-yellow);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    .player-marker.receiver .role-badge { background: var(--accent-yellow); color: #000; }

    .modal {
      display: none; position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 20; padding: 20px; overflow-y: auto;
    }

    .modal-content {
      background: var(--card-bg); border-radius: 12px;
      padding: 20px; max-width: 420px; margin: 10px auto;
      border: 1px solid #2e5941; position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h2 {
      color: var(--accent-yellow);
      font-size: 1.1rem;
      margin: 0;
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-close-modal:hover {
      color: var(--accent-yellow);
    }

    .modal h3 { color: var(--accent-yellow); font-size: 0.95rem; margin: 16px 0 8px 0; border-top: 1px dashed #2e5941; padding-top: 10px; }
    
    .setting-group { margin-bottom: 12px; }
    .setting-group label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
    .setting-group select, .setting-group input {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #2e5941; background: #0c1911; color: white; font-size: 0.85rem;
    }
    .input-row { display: flex; gap: 6px; margin-top: 4px; }

    .swipe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-save {
      width: 100%; padding: 10px; background: var(--accent-yellow);
      border: none; border-radius: 6px; font-weight: bold; color: #000;
      cursor: pointer; margin-top: 15px; font-size: 0.9rem;
    }

    .confirm-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 150;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .confirm-box {
      background: var(--card-bg);
      border: 1px solid #2e5941;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .confirm-box p {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #fff;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .confirm-btns {
      display: flex;
      gap: 10px;
    }

    .confirm-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-confirm-yes {
      background: var(--accent-yellow);
      color: #000;
    }

    .btn-confirm-no {
      background: #1c3829;
      color: #fff;
      border: 1px solid #2e5941 !important;
    }

  </style>
</head>
<body>

  <!-- 미허가 접근 안내 레이어 -->
  <div id="unauthorized-access">
    <h2>Access Denied</h2>
    <p>잘못된 접근입니다.</p>
  </div>

  <div id="fs-overlay">
    <h2>WP TENNIS SCOREBOARD</h2>
    <button class="btn-fullscreen-start" onclick="startFullscreenApp()">전체화면으로 시작하기</button>
  </div>

  <header>
    <h1>TENNIS SCOREBOARD</h1>
    <div class="header-btns">
      <button class="btn-icon" id="btn-fullscreen-toggle" onclick="toggleFullscreen()">Full Screen</button>
      <button class="btn-icon" id="btn-settings">Settings</button>
    </div>
  </header>

  <div class="scoreboard" id="scoreboard-container">
    <div class="team-card team-a" id="card-team-a" style="order: 1;">
      <div class="team-header">
        <div class="team-info">
          <span class="serve-ball" id="serve-a"></span>
          <div>
            <div class="team-title-row">
              <span class="team-name">Team A</span>
              <span class="court-arrow" id="arrow-a">◀</span>
            </div>
            <div class="player-names" id="disp-players-a">Player A1 / A2</div>
          </div>
        </div>
        <span class="sets-won" id="sets-a">0</span>
      </div>
      <div class="score-body">
        <div class="games-score" id="games-a">0</div>
        <div class="point-score" id="points-a">0</div>
      </div>
      <button class="btn-score-up" onclick="addPoint('A')"></button>
    </div>

    <div class="team-card team-b" id="card-team-b" style="order: 2;">
      <div class="team-header">
        <div class="team-info">
          <span class="serve-ball" id="serve-b"></span>
          <div>
            <div class="team-title-row">
              <span class="team-name">Team B</span>
              <span class="court-arrow" id="arrow-b">▶</span>
            </div>
            <div class="player-names" id="disp-players-b">Player B1 / B2</div>
          </div>
        </div>
        <span class="sets-won" id="sets-b">0</span>
      </div>
      <div class="score-body">
        <div class="games-score" id="games-b">0</div>
        <div class="point-score" id="points-b">0</div>
      </div>
      <button class="btn-score-up" onclick="addPoint('B')"></button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-action" onclick="undo()">CORRECTION</button>
    <button class="btn-action highlight" id="btn-toggle-serve" onclick="toggleServeTeam()">SERVE: TEAM A</button>
    <button class="btn-action" onclick="manualCourtChange()">CHANGE COURT</button>
    <button class="btn-action" onclick="confirmResetMatch()">RESET</button>
  </div>

  <div class="court-container">
    <div class="court-inner">
      <div class="court-side left" id="side-left-bg"></div>
      <div class="court-side right" id="side-right-bg"></div>

      <div class="net-line"></div>
      <div class="singles-line-top"></div>
      <div class="singles-line-bottom"></div>
      <div class="service-line-left"></div>
      <div class="service-line-right"></div>
      <div class="center-service-line"></div>
      <div class="hash-left"></div>
      <div class="hash-right"></div>

      <span class="side-label left" id="label-left">TEAM A</span>
      <span class="side-label right" id="label-right">TEAM B</span>

      <div class="target-service-box" id="target-box"></div>

      <div class="player-marker" id="pm-a1"></div>
      <div class="player-marker" id="pm-a2"></div>
      <div class="player-marker" id="pm-b1"></div>
      <div class="player-marker" id="pm-b2"></div>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Match Settings</h2>
        <button class="btn-close-modal" id="btn-close-settings">&times;</button>
      </div>
      
      <div class="setting-group">
        <label>Match Type</label>
        <select id="set-type" onchange="togglePlayerInputs()">
          <option value="doubles" selected>Doubles</option>
          <option value="singles">Singles</option>
        </select>
      </div>

      <div class="setting-group">
        <label>First Serve Team</label>
        <select id="set-first-serve">
          <option value="A" selected>Team A</option>
          <option value="B">Team B</option>
        </select>
      </div>

      <div class="setting-group doubles-setting">
        <label>First Server in Each Team</label>
        <div class="input-row">
          <select id="set-first-server-a">
            <option value="0">Player 1</option>
            <option value="1">Player 2</option>
          </select>
          <select id="set-first-server-b">
            <option value="0">Player 1</option>
            <option value="1">Player 2</option>
          </select>
        </div>
      </div>

      <div class="setting-group doubles-setting">
        <label>First Receiver in Each Team</label>
        <div class="input-row">
          <select id="set-first-receiver-a">
            <option value="0">Player 1</option>
            <option value="1">Player 2</option>
          </select>
          <select id="set-first-receiver-b">
            <option value="0">Player 1</option>
            <option value="1">Player 2</option>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <label>Sets to Win</label>
        <select id="set-sets">
          <option value="1">1 Set (Single Set)</option>
          <option value="2" selected>Best of 3 (2 Sets)</option>
          <option value="3">Best of 5 (3 Sets)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Games per Set</label>
        <select id="set-games">
          <option value="3">3 Games</option>
          <option value="5">5 Games</option>
          <option value="6" selected>6 Games</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Deuce Rule</label>
        <select id="set-deuce">
          <option value="no-ad">No-Ad (Sudden Death)</option>
          <option value="ad" selected>Advantage (Standard)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Court Change</label>
        <select id="set-court">
          <option value="manual" selected>Manual</option>
          <option value="auto">Auto (Official: Odd Games)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Doubles Server Order Voice Call (복식 서브 순서 콜)</label>
        <select id="set-announce-server">
          <option value="3000" selected>3초 후 Call</option>
          <option value="5000">5초 후 Call</option>
          <option value="7000">7초 후 Call</option>
          <option value="off">사용 안 함 (Off)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Team A Players</label>
        <div class="input-row">
          <input type="text" id="p-a1" value="A. Murray" placeholder="Player 1" />
          <input type="text" id="p-a2" value="J. Peers" placeholder="Player 2" />
        </div>
      </div>

      <div class="setting-group">
        <label>Team B Players</label>
        <div class="input-row">
          <input type="text" id="p-b1" value="R. Nadal" placeholder="Player 1" />
          <input type="text" id="p-b2" value="M. Lopez" placeholder="Player 2" />
        </div>
      </div>

      <h3>Swipe Gesture Settings</h3>
      <div class="swipe-grid">
        <div class="setting-group">
          <label>Swipe Up (위로)</label>
          <select id="swipe-up">
            <option value="right_score">우측팀 득점</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="court_change">코트 체인지</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Swipe Down (아래로)</label>
          <select id="swipe-down">
            <option value="left_score">좌측팀 득점</option>
            <option value="right_score">우측팀 득점</option>
            <option value="court_change">코트 체인지</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Swipe Left (왼쪽으로)</label>
          <select id="swipe-left">
            <option value="court_change" selected>코트 체인지</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="right_score">우측팀 득점</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>

        <div class="setting-group">
          <label>Swipe Right (오른쪽으로)</label>
          <select id="swipe-right">
            <option value="undo" selected>Correction (점수 정정)</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="right_score">우측팀 득점</option>

      <h3>Smartwatch / Media Key Controls</h3>
      <div class="swipe-grid">
        <div class="setting-group">
          <label>Next Track (다음곡)</label>
          <select id="media-next">
            <option value="right_score" selected>우측팀 득점</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="court_change">코트 체인지</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Previous Track (이전곡)</label>
          <select id="media-prev">
            <option value="left_score" selected>좌측팀 득점</option>
            <option value="right_score">우측팀 득점</option>
            <option value="court_change">코트 체인지</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Pause (일시정지)</label>
          <select id="media-pause">
            <option value="undo" selected>Correction (점수 정정)</option>
            <option value="right_score">우측팀 득점</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="court_change">코트 체인지</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Play (재생)</label>
          <select id="media-play">
            <option value="court_change" selected>코트 체인지</option>
            <option value="right_score">우측팀 득점</option>
            <option value="left_score">좌측팀 득점</option>
            <option value="undo">Correction (점수 정정)</option>
            <option value="none">사용 안 함</option>
          </select>
        </div>
      </div>

      <button class="btn-save" id="btn-save-settings">Apply & Reset Match</button>
    </div>
  </div>

  <div class="confirm-modal" id="custom-confirm-modal">
    <div class="confirm-box">
      <p id="confirm-message">안내문구가 여기에 표시됩니다.</p>
      <div class="confirm-btns">
        <button class="btn-confirm-yes" id="btn-confirm-yes">확인</button>
        <button class="btn-confirm-no" id="btn-confirm-no">취소</button>
      </div>
    </div>
  </div>

  <script>
    const ALLOWED_HOSTS = ["weonpyo.github.io", "localhost", "127.0.0.1", ""];
    function checkDomainAuth() {
      if (!ALLOWED_HOSTS.includes(window.location.hostname)) {
        const authDiv = document.getElementById('unauthorized-access');
        if (authDiv) authDiv.style.display = 'flex';
        return false;
      }
      return true;
    }

    const DEFAULT_CONFIG = {
      type: 'doubles',
      firstServeTeam: 'A',
      firstServerA: 0,
      firstServerB: 0,
      firstReceiverA: 0,
      firstReceiverB: 0,
      setsToWin: 2,
      gamesPerSet: 6,
      deuceRule: 'ad',
      courtChange: 'manual',
      announceServer: '3000',
      playersA: ['A. Murray', 'J. Peers'],
      playersB: ['R. Nadal', 'M. Lopez'],
      swipes: { up: 'right_score', down: 'left_score', left: 'court_change', right: 'undo' },
      mediaKeys: { nexttrack: 'right_score', previoustrack: 'left_score', pause: 'undo', play: 'court_change' }
    };

    let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

    function makeInitialState() {
      return {
        ptsA: 0, ptsB: 0,
        gamesA: 0, gamesB: 0,
        setsA: 0, setsB: 0,
        isTiebreak: false,
        tiebreakFirstServer: null,
        currentServerTeam: config.firstServeTeam,
        serverIdxA: Number(config.firstServerA) || 0,
        serverIdxB: Number(config.firstServerB) || 0,
        receiverIdxA: Number(config.firstReceiverA) || 0,
        receiverIdxB: Number(config.firstReceiverB) || 0,
        courtLeftTeam: 'A',
        matchComplete: false
      };
    }

    let state = makeInitialState();
    let historyStack = [];
    const MAX_HISTORY = 30;
    const pointTerms = ["Love", "Fifteen", "Thirty", "Forty"];

    let wakeLock = null;
    let audioCtx = null;
    let serverAnnounceTimer = null;
    let speechQueue = [];
    let speechBusy = false;

    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

    function cancelServerAnnouncement() {
      if (serverAnnounceTimer) {
        clearTimeout(serverAnnounceTimer);
        serverAnnounceTimer = null;
      }
    }

    function normalizeConfig() {
      config = { ...DEFAULT_CONFIG, ...config };
      config.swipes = { ...DEFAULT_CONFIG.swipes, ...(config.swipes || {}) };
      config.mediaKeys = { ...DEFAULT_CONFIG.mediaKeys, ...(config.mediaKeys || {}) };
      config.playersA = Array.isArray(config.playersA) ? [...config.playersA] : [...DEFAULT_CONFIG.playersA];
      config.playersB = Array.isArray(config.playersB) ? [...config.playersB] : [...DEFAULT_CONFIG.playersB];
      config.firstServerA = Number(config.firstServerA) === 1 ? 1 : 0;
      config.firstServerB = Number(config.firstServerB) === 1 ? 1 : 0;
      config.firstReceiverA = Number(config.firstReceiverA) === 1 ? 1 : 0;
      config.firstReceiverB = Number(config.firstReceiverB) === 1 ? 1 : 0;
      if (![1,2,3].includes(Number(config.setsToWin))) config.setsToWin = 2;
      if (![3,5,6].includes(Number(config.gamesPerSet))) config.gamesPerSet = 6;
      if (!['ad','no-ad'].includes(config.deuceRule)) config.deuceRule = 'ad';
      if (!['manual','auto'].includes(config.courtChange)) config.courtChange = 'manual';
    }

    function loadStorage() {
      try {
        const savedConfig = localStorage.getItem('tennis_config');
        if (savedConfig) config = { ...config, ...JSON.parse(savedConfig) };
      } catch (e) {}
      normalizeConfig();

      try {
        const savedState = localStorage.getItem('tennis_state');
        if (savedState) {
          const parsed = JSON.parse(savedState);
          if (parsed && typeof parsed === 'object') state = { ...makeInitialState(), ...parsed };
        }
      } catch (e) {}
    }

    function saveConfigToStorage() {
      localStorage.setItem('tennis_config', JSON.stringify(config));
    }

    function saveStateToStorage() {
      localStorage.setItem('tennis_state', JSON.stringify(state));
    }

    function saveHistorySnapshot() {
      historyStack.push(JSON.parse(JSON.stringify(state)));
      if (historyStack.length > MAX_HISTORY) historyStack.shift();
    }

    function undo() {
      cancelServerAnnouncement();
      if (!historyStack.length) return;
      state = historyStack.pop();
      saveStateToStorage();
      render();
      speakCall("Correction, ");
    }

    function confirmResetMatch() {
      showCustomConfirm("정말로 경기를 초기화하시겠습니까?", resetMatch);
    }

    function resetMatch() {
      cancelServerAnnouncement();
      stopSpeech();
      state = makeInitialState();
      historyStack = [];
      saveStateToStorage();
      render();
      speak("Reset");
    }

    function toggleServeTeam() {
      if (state.matchComplete) return;
      cancelServerAnnouncement();
      saveHistorySnapshot();
      state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
      saveStateToStorage();
      render();
      speak(`Service Team ${state.currentServerTeam}`);
    }

    function addPoint(team) {
      if (!['A','B'].includes(team) || state.matchComplete) return;
      cancelServerAnnouncement();
      saveHistorySnapshot();

      if (state.isTiebreak) handleTiebreakPoint(team);
      else handleStandardPoint(team);

      saveStateToStorage();
      render();
    }

    function handleStandardPoint(team) {
      const isA = team === 'A';
      const pWin = isA ? state.ptsA : state.ptsB;
      const pLose = isA ? state.ptsB : state.ptsA;

      // No-Ad: at 40-40 the next point decides the game.
      if (config.deuceRule === 'no-ad' && pWin === 3 && pLose === 3) {
        winGame(team);
        return;
      }

      if (pWin >= 3 && pLose >= 3) {
        if (pWin === pLose) {
          if (isA) state.ptsA++; else state.ptsB++;
          speakCall();
        } else if (pWin > pLose) {
          winGame(team);
        } else {
          // Advantage was lost: back to deuce.
          state.ptsA = 3;
          state.ptsB = 3;
          speakCall();
        }
      } else if (pWin === 3) {
        winGame(team);
      } else {
        if (isA) state.ptsA++; else state.ptsB++;
        speakCall();
      }
    }

    function handleTiebreakPoint(team) {
      if (team === 'A') state.ptsA++; else state.ptsB++;

      const totalPts = state.ptsA + state.ptsB;

      // First server serves point 1; the opponent serves points 2-3;
      // thereafter service changes every two points.
      if (totalPts % 2 === 1) switchServer();

      if (config.courtChange === 'auto' && totalPts % 6 === 0) {
        changeEnds(false, false);
      }

      if ((state.ptsA >= 7 || state.ptsB >= 7) &&
          Math.abs(state.ptsA - state.ptsB) >= 2) {
        winTiebreak(state.ptsA > state.ptsB ? 'A' : 'B');
      } else {
        speakCall();
      }
    }

    function getLastName(fullName) {
      if (!fullName) return "";
      const parts = String(fullName).trim().split(/\s+/);
      return parts[parts.length - 1] || "";
    }

    function getTeamDisplayName(team) {
      if (config.type === 'singles') {
        return getLastName(team === 'A' ? config.playersA[0] : config.playersB[0]);
      }
      return `Team ${team}`;
    }

    function winGame(team) {
      cancelServerAnnouncement();

      if (team === 'A') state.gamesA++;
      else state.gamesB++;

      state.ptsA = 0;
      state.ptsB = 0;

      const gWin = team === 'A' ? state.gamesA : state.gamesB;
      const gLose = team === 'A' ? state.gamesB : state.gamesA;
      const totalGames = state.gamesA + state.gamesB;
      const winnerCall = getTeamDisplayName(team);

      if (config.courtChange === 'auto' && totalGames % 2 === 1 && !state.isTiebreak) {
        changeEnds(false, false);
      }

      if (gWin >= config.gamesPerSet && gWin - gLose >= 2) {
        winSet(team, false);
      } else if (gWin === config.gamesPerSet && gLose === config.gamesPerSet) {
        state.isTiebreak = true;
        // Service for the first point of the tiebreak is the team due to serve
        // after the final standard game.
        switchServer();
        state.tiebreakFirstServer = state.currentServerTeam;
        speak(`Game ${winnerCall}, ${state.gamesA} games to ${state.gamesB}, Tiebreak`);
        scheduleServerAnnouncement();
      } else {
        speak(`Game ${winnerCall}, ${state.gamesA} games to ${state.gamesB}`);
        switchServer();
        scheduleServerAnnouncement();
      }
    }

    function winTiebreak(team) {
      const firstServer = state.tiebreakFirstServer;
      winSet(team, true, firstServer);
    }

    function winSet(team, viaTiebreak = false, tiebreakFirstServer = null) {
      cancelServerAnnouncement();

      if (team === 'A') state.setsA++;
      else state.setsB++;

      const winnerCall = getTeamDisplayName(team);
      const matchWon = (team === 'A' ? state.setsA : state.setsB) >= config.setsToWin;

      state.gamesA = 0;
      state.gamesB = 0;
      state.ptsA = 0;
      state.ptsB = 0;
      state.isTiebreak = false;
      state.tiebreakFirstServer = null;

      if (matchWon) {
        state.matchComplete = true;
        speak(`Game, set and match, ${winnerCall}, ${state.setsA} sets to ${state.setsB}`);
        return;
      }

      // The team that served first in the tiebreak receives first in the next set,
      // so the opposite team serves first. Otherwise, service simply alternates
      // from the last standard game.
      if (viaTiebreak && tiebreakFirstServer) {
        state.currentServerTeam = tiebreakFirstServer === 'A' ? 'B' : 'A';
      } else {
        state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
      }

      // A legal and predictable choice for the next set: each team's configured
      // first server/receiver order is used again.
      state.serverIdxA = config.firstServerA;
      state.serverIdxB = config.firstServerB;
      state.receiverIdxA = config.firstReceiverA;
      state.receiverIdxB = config.firstReceiverB;

      // If the set ended with an odd number of games, the court change occurs now.
      // If it ended with an even number, it occurs after game 1 of the next set.
      if (config.courtChange === 'auto' && viaTiebreak) {
        changeEnds(false, false);
      }

      speak(`Set, ${winnerCall}, ${state.setsA} sets to ${state.setsB}`);
      scheduleServerAnnouncement();
    }

    function switchServer() {
      if (config.type === 'singles') {
        state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
        return;
      }

      if (state.currentServerTeam === 'A') {
        state.currentServerTeam = 'B';
      } else {
        state.currentServerTeam = 'A';
        state.serverIdxA = (state.serverIdxA + 1) % 2;
        state.serverIdxB = (state.serverIdxB + 1) % 2;
      }
    }

    function scheduleServerAnnouncement() {
      cancelServerAnnouncement();
      if (config.type !== 'doubles' || config.announceServer === 'off' || state.matchComplete) return;

      const delayMs = parseInt(config.announceServer || '3000', 10);
      serverAnnounceTimer = setTimeout(() => {
        serverAnnounceTimer = null;
        if (config.type !== 'doubles' || state.matchComplete) return;

        const team = state.currentServerTeam;
        const idx = team === 'A' ? state.serverIdxA : state.serverIdxB;
        const name = team === 'A' ? config.playersA[idx] : config.playersB[idx];
        speak(`${getLastName(name)}, first server`);
      }, delayMs);
    }

    function changeEnds(announce = true, recordHistory = true) {
      cancelServerAnnouncement();
      if (recordHistory) saveHistorySnapshot();
      state.courtLeftTeam = state.courtLeftTeam === 'A' ? 'B' : 'A';
      saveStateToStorage();
      render();
      if (announce) speak("Change ends");
    }

    function manualCourtChange() {
      if (state.matchComplete) return;
      changeEnds(true, true);
    }

    function speakCall(prefix = "") {
      let callText = "";

      if (state.isTiebreak) {
        callText = `${state.ptsA}, ${state.ptsB}`;
      } else {
        const pA = state.ptsA;
        const pB = state.ptsB;

        if (pA >= 3 && pB >= 3) {
          if (pA === pB) callText = "Deuce";
          else if (pA > pB) {
            callText = `Advantage, ${config.type === 'singles' ? getLastName(config.playersA[0]) : 'Team A'}`;
          } else {
            callText = `Advantage, ${config.type === 'singles' ? getLastName(config.playersB[0]) : 'Team B'}`;
          }
        } else if (pA === pB) {
          callText = pA === 0 ? "Love All" : `${pointTerms[pA]} All`;
        } else {
          // In tennis the server's score is called first.
          const serverPts = state.currentServerTeam === 'A' ? pA : pB;
          const receiverPts = state.currentServerTeam === 'A' ? pB : pA;
          callText = `${scoreWord(serverPts)}, ${scoreWord(receiverPts)}`;
        }
      }

      speak(prefix + callText);
    }

    function scoreWord(points) {
      return pointTerms[Math.min(points, 3)] || "Forty";
    }

    function formatScore(pts, oppPts) {
      if (state.isTiebreak) return String(pts);
      if (pts >= 3 && oppPts >= 3) {
        if (pts === oppPts) return "40";
        return pts > oppPts ? "AD" : "40";
      }
      return pts === 0 ? "0" : pts === 1 ? "15" : pts === 2 ? "30" : "40";
    }

    function stopSpeech() {
      speechQueue = [];
      speechBusy = false;
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    function enqueueSpeech(text) {
      if (!text) return;
      speechQueue.push(String(text));
      if (speechQueue.length > 8) speechQueue.shift();
      processSpeechQueue();
    }

    async function processSpeechQueue() {
      if (speechBusy || !speechQueue.length || !('speechSynthesis' in window)) return;
      speechBusy = true;
      const text = speechQueue.shift();

      try {
        await playWakeUpSound(120);
        await new Promise(resolve => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 1.0;
          utterance.pitch = 1.0;

          const voices = window.speechSynthesis.getVoices();
          const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us')) ||
                        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
          if (voice) utterance.voice = voice;

          utterance.onend = resolve;
          utterance.onerror = resolve;
          window.speechSynthesis.speak(utterance);
        });
      } catch (e) {}

      speechBusy = false;
      if (speechQueue.length) setTimeout(processSpeechQueue, 30);
    }

    function speak(text) {
      enqueueSpeech(text);
    }

    function playWakeUpSound(durationMs = 120) {
      return new Promise(resolve => {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) { resolve(); return; }
            audioCtx = new Ctx();
          }
          const resume = audioCtx.state === 'suspended' ? audioCtx.resume() : Promise.resolve();
          resume.finally(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = 440;
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + durationMs / 1000);
            setTimeout(resolve, durationMs);
          });
        } catch (e) {
          resolve();
        }
      });
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try {
        if (!wakeLock || wakeLock.released) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
        }
      } catch (e) {}
    }

    async function keepScreenAlive() {
      await requestWakeLock();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
        render();
      }
    });

    // Wake Lock is not a guarantee on every phone/browser. Re-request only
    // while visible; this avoids the old silent audio/video workaround.
    setInterval(requestWakeLock, 30000);

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const elem = document.documentElement;
        const p = elem.requestFullscreen ? elem.requestFullscreen() :
                  elem.webkitRequestFullscreen ? elem.webkitRequestFullscreen() : null;
        if (p && p.catch) p.catch(() => {});
      } else {
        const p = document.exitFullscreen ? document.exitFullscreen() :
                  document.webkitExitFullscreen ? document.webkitExitFullscreen() : null;
        if (p && p.catch) p.catch(() => {});
      }
    }

    async function startFullscreenApp() {
      toggleFullscreen();
      await keepScreenAlive();
      document.getElementById('fs-overlay').style.display = 'none';
      render();
    }

    function showCustomConfirm(message, onConfirm) {
      const confirmModal = document.getElementById('custom-confirm-modal');
      const confirmMsg = document.getElementById('confirm-message');
      const btnYes = document.getElementById('btn-confirm-yes');
      const btnNo = document.getElementById('btn-confirm-no');

      confirmMsg.innerText = message;
      confirmModal.style.display = 'flex';

      const handleYes = () => {
        cleanup();
        confirmModal.style.display = 'none';
        onConfirm();
      };
      const handleNo = () => {
        cleanup();
        confirmModal.style.display = 'none';
      };
      const cleanup = () => {
        btnYes.removeEventListener('click', handleYes);
        btnNo.removeEventListener('click', handleNo);
      };

      btnYes.addEventListener('click', handleYes);
      btnNo.addEventListener('click', handleNo);
    }

    function setupEvents() {
      const modal = document.getElementById('settings-modal');

      document.getElementById('btn-settings').onclick = () => {
        populateSettingsModal();
        modal.style.display = 'block';
      };
      document.getElementById('btn-close-settings').onclick = () => {
        modal.style.display = 'none';
      };
      window.addEventListener('click', event => {
        if (event.target === modal) modal.style.display = 'none';
      });

      document.getElementById('btn-save-settings').onclick = () => {
        showCustomConfirm("설정을 적용하고 경기 점수를 초기화하시겠습니까?", () => {
          saveSettings();
          modal.style.display = 'none';
        });
      };

      document.getElementById('set-first-serve').addEventListener('change', updateFirstServerSelects);
      updateFirstServerSelects();
    }

    function updateFirstServerSelects() {
      const firstTeam = document.getElementById('set-first-serve').value;
      const a = document.getElementById('set-first-server-a');
      const b = document.getElementById('set-first-server-b');
      if (a) a.disabled = false;
      if (b) b.disabled = false;
      // No need to disable the non-first team: it will choose its first server
      // when it first serves in the set, and the saved choice remains valid.
      updateSelectLabels();
    }

    function updateSelectLabels() {
      const ids = [
        ['set-first-server-a', config.playersA],
        ['set-first-server-b', config.playersB],
        ['set-first-receiver-a', config.playersA],
        ['set-first-receiver-b', config.playersB]
      ];
      ids.forEach(([id, players]) => {
        const el = document.getElementById(id);
        if (!el) return;
        const opts = el.options;
        for (let i = 0; i < opts.length; i++) opts[i].textContent = players[i] || `Player ${i+1}`;
      });
    }

    function setupSwipeEvents() {
      window.addEventListener('touchstart', e => {
        if (e.target.closest('.modal') || e.target.closest('.confirm-modal')) return;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      window.addEventListener('touchend', e => {
        if (e.target.closest('.modal') || e.target.closest('.confirm-modal')) return;
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipeGesture();
      }, { passive: true });
    }

    function handleSwipeGesture() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const minDistance = 40;
      if (Math.abs(deltaX) < minDistance && Math.abs(deltaY) < minDistance) return;

      let action;
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        action = deltaX < 0 ? config.swipes.left : config.swipes.right;
      } else {
        action = deltaY < 0 ? config.swipes.up : config.swipes.down;
      }
      executeControlAction(action);
    }

    function executeControlAction(action) {
      const leftTeam = state.courtLeftTeam;
      const rightTeam = leftTeam === 'A' ? 'B' : 'A';

      switch (action) {
        case 'left_score': addPoint(leftTeam); break;
        case 'right_score': addPoint(rightTeam); break;
        case 'court_change': manualCourtChange(); break;
        case 'undo': undo(); break;
      }
    }

    function populateSettingsModal() {
      document.getElementById('set-type').value = config.type;
      document.getElementById('set-first-serve').value = config.firstServeTeam;
      document.getElementById('set-sets').value = config.setsToWin;
      document.getElementById('set-games').value = config.gamesPerSet;
      document.getElementById('set-deuce').value = config.deuceRule;
      document.getElementById('set-court').value = config.courtChange;
      document.getElementById('set-announce-server').value = config.announceServer || '3000';

      document.getElementById('p-a1').value = config.playersA[0] || '';
      document.getElementById('p-a2').value = config.playersA[1] || '';
      document.getElementById('p-b1').value = config.playersB[0] || '';
      document.getElementById('p-b2').value = config.playersB[1] || '';

      document.getElementById('set-first-server-a').value = String(config.firstServerA);
      document.getElementById('set-first-server-b').value = String(config.firstServerB);
      document.getElementById('set-first-receiver-a').value = String(config.firstReceiverA);
      document.getElementById('set-first-receiver-b').value = String(config.firstReceiverB);

      document.getElementById('swipe-up').value = config.swipes.up || 'right_score';
      document.getElementById('swipe-down').value = config.swipes.down || 'left_score';
      document.getElementById('swipe-left').value = config.swipes.left || 'court_change';
      document.getElementById('swipe-right').value = config.swipes.right || 'undo';

      document.getElementById('media-next').value = config.mediaKeys.nexttrack || 'right_score';
      document.getElementById('media-prev').value = config.mediaKeys.previoustrack || 'left_score';
      document.getElementById('media-pause').value = config.mediaKeys.pause || 'undo';
      document.getElementById('media-play').value = config.mediaKeys.play || 'court_change';

      togglePlayerInputs();
      updateSelectLabels();
    }

    function togglePlayerInputs() {
      const isSingles = document.getElementById('set-type').value === 'singles';
      document.getElementById('p-a2').style.display = isSingles ? 'none' : 'block';
      document.getElementById('p-b2').style.display = isSingles ? 'none' : 'block';

      document.querySelectorAll('.doubles-setting').forEach(el => {
        el.style.display = isSingles ? 'none' : 'block';
      });
    }

    function saveSettings() {
      cancelServerAnnouncement();

      config.type = document.getElementById('set-type').value;
      config.firstServeTeam = document.getElementById('set-first-serve').value;
      config.setsToWin = parseInt(document.getElementById('set-sets').value, 10);
      config.gamesPerSet = parseInt(document.getElementById('set-games').value, 10);
      config.deuceRule = document.getElementById('set-deuce').value;
      config.courtChange = document.getElementById('set-court').value;
      config.announceServer = document.getElementById('set-announce-server').value;

      config.playersA = [
        document.getElementById('p-a1').value.trim() || 'A1',
        document.getElementById('p-a2').value.trim() || 'A2'
      ];
      config.playersB = [
        document.getElementById('p-b1').value.trim() || 'B1',
        document.getElementById('p-b2').value.trim() || 'B2'
      ];

      config.firstServerA = parseInt(document.getElementById('set-first-server-a').value, 10);
      config.firstServerB = parseInt(document.getElementById('set-first-server-b').value, 10);
      config.firstReceiverA = parseInt(document.getElementById('set-first-receiver-a').value, 10);
      config.firstReceiverB = parseInt(document.getElementById('set-first-receiver-b').value, 10);

      config.swipes = {
        up: document.getElementById('swipe-up').value,
        down: document.getElementById('swipe-down').value,
        left: document.getElementById('swipe-left').value,
        right: document.getElementById('swipe-right').value
      };
      config.mediaKeys = {
        nexttrack: document.getElementById('media-next').value,
        previoustrack: document.getElementById('media-prev').value,
        pause: document.getElementById('media-pause').value,
        play: document.getElementById('media-play').value
      };

      normalizeConfig();
      saveConfigToStorage();
      resetMatch();
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;

      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Tennis Scoreboard",
          artist: "WP Scoreboard",
          album: "Tennis"
        });
      } catch (e) {}

      const actions = [
        ['nexttrack', () => executeControlAction(config.mediaKeys.nexttrack)],
        ['previoustrack', () => executeControlAction(config.mediaKeys.previoustrack)],
        ['pause', () => executeControlAction(config.mediaKeys.pause)],
        ['play', () => executeControlAction(config.mediaKeys.play)],
        ['playpause', () => executeControlAction(config.mediaKeys.play)]
      ];

      for (const [action, handler] of actions) {
        try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {}
      }
    }

    function render() {
      document.getElementById('disp-players-a').innerText =
        config.type === 'doubles' ? `${config.playersA[0]} / ${config.playersA[1]}` : config.playersA[0];
      document.getElementById('disp-players-b').innerText =
        config.type === 'doubles' ? `${config.playersB[0]} / ${config.playersB[1]}` : config.playersB[0];

      document.getElementById('sets-a').innerText = state.setsA;
      document.getElementById('sets-b').innerText = state.setsB;
      document.getElementById('games-a').innerText = state.gamesA;
      document.getElementById('games-b').innerText = state.gamesB;
      document.getElementById('points-a').innerText = formatScore(state.ptsA, state.ptsB);
      document.getElementById('points-b').innerText = formatScore(state.ptsB, state.ptsA);

      document.getElementById('serve-a').classList.toggle('active', state.currentServerTeam === 'A');
      document.getElementById('serve-b').classList.toggle('active', state.currentServerTeam === 'B');
      document.getElementById('btn-toggle-serve').innerText = state.matchComplete
        ? 'MATCH COMPLETE' : `SERVE: TEAM ${state.currentServerTeam}`;

      const leftTeam = state.courtLeftTeam;
      const rightTeam = leftTeam === 'A' ? 'B' : 'A';

      const cardA = document.getElementById('card-team-a');
      const cardB = document.getElementById('card-team-b');
      cardA.style.order = leftTeam === 'A' ? 1 : 2;
      cardB.style.order = leftTeam === 'A' ? 2 : 1;

      document.getElementById('arrow-a').innerText = leftTeam === 'A' ? '◀' : '▶';
      document.getElementById('arrow-b').innerText = leftTeam === 'B' ? '◀' : '▶';

      document.getElementById('side-left-bg').className =
        `court-side left ${leftTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;
      document.getElementById('side-right-bg').className =
        `court-side right ${rightTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;
      document.getElementById('label-left').innerText = `TEAM ${leftTeam}`;
      document.getElementById('label-right').innerText = `TEAM ${rightTeam}`;

      const totalPts = state.ptsA + state.ptsB;
      const isDeuceServe = totalPts % 2 === 0;
      const isDoubles = config.type === 'doubles';
      const serverTeam = state.currentServerTeam;
      const activeServerIdx = isDoubles
        ? (serverTeam === 'A' ? state.serverIdxA : state.serverIdxB) : 0;

      const receiverTeam = serverTeam === 'A' ? 'B' : 'A';
      const receiverIdx = isDoubles
        ? (receiverTeam === 'A' ? state.receiverIdxA : state.receiverIdxB) : 0;
      const currentReceiverIdx = isDoubles ? (isDeuceServe ? receiverIdx : 1 - receiverIdx) : 0;

      const pmA1 = document.getElementById('pm-a1');
      const pmA2 = document.getElementById('pm-a2');
      const pmB1 = document.getElementById('pm-b1');
      const pmB2 = document.getElementById('pm-b2');

      const updateMarkerContent = (el, name, role) => {
        const safeName = String(name || '').replace(/[&<>"']/g, ch => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[ch]));
        el.innerHTML = `<span class="player-name-text">${safeName}</span>` +
          (role ? `<span class="role-badge visible">${role}</span>` : `<span class="role-badge"></span>`);
      };

      const server = (team, idx) => serverTeam === team && activeServerIdx === idx;
      const receiver = (team, idx) => receiverTeam === team && currentReceiverIdx === idx;

      updateMarkerContent(pmA1, config.playersA[0], server('A',0) ? 'SERVE' : receiver('A',0) ? 'RECEIVE' : '');
      updateMarkerContent(pmA2, config.playersA[1], server('A',1) ? 'SERVE' : receiver('A',1) ? 'RECEIVE' : '');
      updateMarkerContent(pmB1, config.playersB[0], server('B',0) ? 'SERVE' : receiver('B',0) ? 'RECEIVE' : '');
      updateMarkerContent(pmB2, config.playersB[1], server('B',1) ? 'SERVE' : receiver('B',1) ? 'RECEIVE' : '');

      pmA1.style.background = 'var(--team-a-color)';
      pmA2.style.background = 'var(--team-a-color)';
      pmB1.style.background = 'var(--team-b-color)';
      pmB2.style.background = 'var(--team-b-color)';

      pmA2.style.display = isDoubles ? 'flex' : 'none';
      pmB2.style.display = isDoubles ? 'flex' : 'none';

      document.querySelectorAll('.player-marker').forEach(m => m.classList.remove('server','receiver'));
      if (server('A',0)) pmA1.classList.add('server');
      if (server('A',1)) pmA2.classList.add('server');
      if (server('B',0)) pmB1.classList.add('server');
      if (server('B',1)) pmB2.classList.add('server');
      if (receiver('A',0)) pmA1.classList.add('receiver');
      if (receiver('A',1)) pmA2.classList.add('receiver');
      if (receiver('B',0)) pmB1.classList.add('receiver');
      if (receiver('B',1)) pmB2.classList.add('receiver');

      const setPos = (el, x, y) => {
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
      };

      const targetBox = document.getElementById('target-box');

      const placeTeamPlayers = (team, isLeft) => {
        const p1 = team === 'A' ? pmA1 : pmB1;
        const p2 = team === 'A' ? pmA2 : pmB2;
        const isServerTeam = serverTeam === team;
        const serverIdx = isServerTeam ? activeServerIdx : -1;
        const receiveIdx = receiverTeam === team ? currentReceiverIdx : -1;

        if (isLeft) {
          if (isServerTeam) {
            const yServer = isDeuceServe ? 70 : 30;
            const yPartner = isDeuceServe ? 30 : 70;
            setPos(serverIdx === 0 ? p1 : p2, 10, yServer);
            if (isDoubles) setPos(serverIdx === 0 ? p2 : p1, 38, yPartner);
          } else {
            const yReceiver = isDeuceServe ? 30 : 70;
            const yPartner = isDeuceServe ? 70 : 30;
            setPos(receiveIdx === 0 ? p1 : p2, 84, yReceiver);
            if (isDoubles) setPos(receiveIdx === 0 ? p2 : p1, 84, yPartner);
          }
        } else {
          if (isServerTeam) {
            const yServer = isDeuceServe ? 30 : 70;
            const yPartner = isDeuceServe ? 70 : 30;
            setPos(serverIdx === 0 ? p1 : p2, 90, yServer);
            if (isDoubles) setPos(serverIdx === 0 ? p2 : p1, 62, yPartner);
          } else {
            const yReceiver = isDeuceServe ? 70 : 30;
            const yPartner = isDeuceServe ? 30 : 70;
            setPos(receiveIdx === 0 ? p1 : p2, 16, yReceiver);
            if (isDoubles) setPos(receiveIdx === 0 ? p2 : p1, 16, yPartner);
          }
        }
      };

      placeTeamPlayers(leftTeam, true);
      placeTeamPlayers(rightTeam, false);

      const serverOnLeft = serverTeam === leftTeam;
      if (serverOnLeft) {
        setPos(targetBox, 50, isDeuceServe ? 15 : 50);
      } else {
        setPos(targetBox, 25, isDeuceServe ? 50 : 15);
      }
    }

    window.onload = async () => {
      if (!checkDomainAuth()) return;
      loadStorage();
      setupEvents();
      setupSwipeEvents();
      populateSettingsModal();
      setupMediaSession();
      await keepScreenAlive();
      render();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }
    };

  </script>
</body>
</html>
