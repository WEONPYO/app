<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 스캐너</title>
    <!-- 카메라 바코드 스캔 라이브러리 (CDN) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            color: #1a1a1a;
        }

        /* 스캐너 영역 */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: none !important;
            background: #000;
        }

        /* 수동 입력 영역 */
        .manual-input {
            display: flex;
            gap: 8px;
        }

        .manual-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .manual-input input:focus {
            border-color: #2563eb;
        }

        /* 버튼 기본 스타일 */
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary { background-color: #2563eb; color: white; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-share { background-color: #fee500; color: #191919; } /* 카톡 상징색 */
        .btn-secondary { background-color: #10b981; color: white; }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-group-full {
            grid-column: span 2;
        }

        /* 스캔 목록 스타일 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .count-badge {
            background-color: #e0e7ff;
            color: #4338ca;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        ul {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
        }

        li {
            padding: 10px 12px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.95rem;
        }

        li:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .empty-msg {
            text-align: center;
            color: #9ca3af;
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 바코드 스캐너</h1>

    <!-- 카메라 스캔 화면 -->
    <div id="reader"></div>

    <!-- 수동 입력 폼 -->
    <div class="manual-input">
        <input type="text" id="barcode-input" placeholder="바코드 직접 입력 후 엔터" onkeydown="handleKeyPress(event)">
        <button class="btn-primary" onclick="addManualBarcode()">추가</button>
    </div>

    <!-- 작업 버튼 그룹 -->
    <div class="btn-group">
        <button class="btn-warning" onclick="removeLastItem()">↩️ 마지막 항목 지우기</button>
        <button class="btn-danger" onclick="clearAllData()">🗑️ 전체 초기화</button>
        <button class="btn-share btn-group-full" onclick="shareData()">📋 전체 복사 및 공유</button>
        <button class="btn-secondary btn-group-full" onclick="downloadTXT()">💾 텍스트 파일(.txt) 저장</button>
    </div>

    <!-- 스캔 결과 목록 -->
    <div>
        <div class="list-header">
            <h3>스캔 목록</h3>
            <span class="count-badge" id="scan-count">0개</span>
        </div>
        <ul id="barcode-list">
            <li class="empty-msg">스캔된 바코드가 없습니다.</li>
        </ul>
    </div>
</div>

<script>
    let barcodeList = [];
    let html5QrcodeScanner = null;
    let isProcessing = false; // 중복 스캔 방지 플래그

    // 페이지 로드 시 기존 데이터 불러오기 및 스캐너 시작
    window.onload = function() {
        loadData();
        initScanner();
    };

    // 로컬스토리지에서 데이터 로드
    function loadData() {
        const savedData = localStorage.getItem('scanned_barcodes');
        if (savedData) {
            barcodeList = JSON.parse(savedData);
            renderList();
        }
    }

    // 로컬스토리지에 데이터 저장
    function saveData() {
        localStorage.setItem('scanned_barcodes', JSON.stringify(barcodeList));
        renderList();
    }

    // 리스트 화면 업데이트
    function renderList() {
        const listElement = document.getElementById('barcode-list');
        const countElement = document.getElementById('scan-count');
        
        countElement.innerText = `${barcodeList.length}개`;
        listElement.innerHTML = '';

        if (barcodeList.length === 0) {
            listElement.innerHTML = '<li class="empty-msg">스캔된 바코드가 없습니다.</li>';
            return;
        }

        // 역순으로 표시하지 않고 순서대로(1번부터) 표시
        barcodeList.forEach((code, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${index + 1}.</strong> ${code}</span>`;
            listElement.appendChild(li);
        });

        // 목록 최하단으로 스크롤 이동
        listElement.scrollTop = listElement.scrollHeight;
    }

    // 바코드 추가 공통 함수
    function addBarcode(code) {
        if (!code.trim()) return;
        barcodeList.push(code.trim());
        saveData();
    }

    // 마지막 항목 삭제 (실행 취소 기능)
    function removeLastItem() {
        if (barcodeList.length === 0) {
            alert("지울 항목이 없습니다.");
            return;
        }
        barcodeList.pop();
        saveData();
    }

    // 전체 초기화
    function clearAllData() {
        if (barcodeList.length === 0) return;
        
        if (confirm("모든 스캔 내역을 삭제하시겠습니까?")) {
            barcodeList = [];
            localStorage.removeItem('scanned_barcodes');
            renderList();
        }
    }

    // 수동 입력 처리
    function addManualBarcode() {
        const input = document.getElementById('barcode-input');
        if (input.value) {
            addBarcode(input.value);
            input.value = '';
            input.focus();
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addManualBarcode();
        }
    }

    // 카메라 스캐너 초기화
    function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 150 },
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            },
            /* verbose= */ false
        );

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    // 바코드 인식 성공 콜백
    function onScanSuccess(decodedText) {
        if (isProcessing) return; // 연속 인식 방지
        isProcessing = true;

        addBarcode(decodedText);

        // 스캔 성공음 (비프음)
        playBeep();

        // 1초간 재인식 대기 (중복 스캔 방지)
        setTimeout(() => {
            isProcessing = false;
        }, 1200);
    }

    function onScanFailure(error) {
        // 프레임당 인식 실패는 흔하므로 로그 생략
    }

    // 비프음 재생 함수 (Web Audio API)
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {
            // AudioContext 미지원 시 무시
        }
    }

    // 공유하기 (클립보드 복사 및 웹 공유)
    async function shareData() {
        if (barcodeList.length === 0) {
            alert("공유할 스캔 내역이 없습니다.");
            return;
        }

        const textContent = barcodeList.join('\n');

        // 모바일 웹 공유 API 지원 시
        if (navigator.share) {
            try {
                await navigator.share({
                    title: '스캔된 바코드 목록',
                    text: textContent
                });
                return;
            } catch (err) {
                // 사용자가 공유를 취소한 경우는 제외하고 클립보드 복사로 복귀
            }
        }

        // 클립보드 복사
        try {
            await navigator.clipboard.writeText(textContent);
            alert("클립보드에 복사되었습니다! 카카오톡 대화창에 붙여넣기(Paste)하세요.");
        } catch (err) {
            alert("복사에 실패했습니다. 수동으로 선택해 복사해 주세요.");
        }
    }

    // TXT 파일로 저장/다운로드
    function downloadTXT() {
        if (barcodeList.length === 0) {
            alert("저장할 데이터가 없습니다.");
            return;
        }

        const textContent = barcodeList.join('\r\n');
        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        
        // 파일명 생성: barcode_YYYYMMDD_HHMMSS.txt
        const now = new Date();
        const timestamp = now.toISOString().slice(0,10).replace(/-/g, "") + "_" + 
                          now.toTimeString().slice(0,8).replace(/:/g, "");
        a.download = `barcode_${timestamp}.txt`;
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
