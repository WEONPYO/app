<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 바코드 스캐너</title>
    <!-- 카메라 바코드 스캔 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- WebRTC 실시간 통신 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        /* 상태 표시바 */
        .status-bar {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .bg-red { background: #ef4444; color: white; }
        .bg-green { background: #10b981; color: white; }

        /* 입력창 스타일 */
        .input-box {
            display: flex;
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }

        .input-box input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-family: monospace;
            font-size: 0.8rem;
        }

        /* 카메라 영역 */
        .scanner-container {
            height: 192px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
            height: 192px !important;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-blue { background: #0284c7; color: white; }
        .btn-sky { background: #0ea5e9; color: white; flex: 1; }
        .btn-indigo { background: #6366f1; color: white; flex: 1; }
        .btn-amber { background: #f59e0b; color: white; flex: 1; }
        .btn-red { background: #ef4444; color: white; flex: 1; }
        .btn-yellow { background: #fee500; color: #191919; flex: 1; }
        .btn-emerald { background: #10b981; color: white; flex: 1; }

        /* 내역 리스트 */
        .list-box {
            flex: 1;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .list-header {
            padding: 6px 10px;
            background: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        ul {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        li {
            padding: 6px 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.8rem;
        }

        li:first-child {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 0.8rem;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 상태 바 -->
    <div class="status-bar">
        <span id="mode-badge" style="font-weight: bold; color: #38bdf8;">모드 감지 중...</span>
        <!-- PC에서만 표시되는 내 ID -->
        <span id="pc-id-area" style="display: none;">PC ID: <strong id="my-id" style="color:#f59e0b; font-size: 0.85rem;">----</strong></span>
        <span id="conn-status" class="badge bg-red">대기</span>
    </div>

    <!-- 카메라 스캔 영역 (모바일 전용) -->
    <div id="scanner-section" style="display: none; flex-direction: column; gap: 6px;">
        <div class="scanner-container">
            <div id="reader"></div>
        </div>
        <!-- 카메라 하단 수동 입력창 -->
        <div class="input-box">
            <input type="text" id="manual-input" placeholder="바코드 직접 입력" onkeydown="if(event.key==='Enter') addManualBar()">
            <button class="btn-blue" onclick="addManualBar()">추가</button>
        </div>
    </div>

    <!-- 버튼 메뉴 -->
    <div class="btn-group">
        <!-- 모바일 전용: 하단 PC 연결 버튼 -->
        <button id="btn-connect" class="btn-sky" onclick="promptConnect()" style="display:none;">🔗 PC 연결</button>
        <button id="btn-restart" class="btn-indigo" onclick="startScanner()" style="display:none;">📷 카메라 재시작</button>
        <button class="btn-amber" onclick="removeLast()">↩️ 지우기</button>
        <button class="btn-red" onclick="clearAll()">🗑️ 초기화</button>
    </div>
    <div class="btn-group">
        <button class="btn-yellow" onclick="copyOrShare()">📋 복사</button>
        <button class="btn-emerald" onclick="downloadTXT()">💾 txt 저장</button>
    </div>

    <!-- 스캔 리스트 -->
    <div class="list-box">
        <div class="list-header">
            <span>스캔 내역 (최신순)</span>
            <span id="scan-count" style="background:#0284c7; padding:1px 6px; border-radius:10px;">0건</span>
        </div>
        <ul id="barcode-list">
            <li class="empty-msg">내역이 없습니다.</li>
        </ul>
    </div>
</div>

<script>
    let isMobile = false;
    let peer = null;
    let conn = null;
    let barcodeList = [];
    let html5QrcodeScanner = null;
    let isScanning = false;

    window.onload = function() {
        // 기존 내역 불러오기
        const saved = localStorage.getItem('barcodes');
        if (saved) {
            barcodeList = JSON.parse(saved);
        }
        renderList();

        // 기기 자동 감지 (스마트폰/모바일 여부 확인)
        isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
            // [모바일 환경]
            document.getElementById('mode-badge').innerText = "📱 모바일 스캔 모드";
            document.getElementById('scanner-section').style.display = 'flex';
            document.getElementById('btn-connect').style.display = 'block';
            document.getElementById('btn-restart').style.display = 'block';
            
            initPeerMobile();
            startScanner();
        } else {
            // [PC 환경]
            document.getElementById('mode-badge').innerText = "💻 PC 수신 모드";
            document.getElementById('pc-id-area').style.display = 'inline';
            
            initPeerPC();
        }
    };

    // PC용 PeerJS (4자리 ID 생성 및 대기)
    function initPeerPC() {
        const numId = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(numId);

        peer.on('open', function(id) {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', function(c) {
            conn = c;
            setupConnection();
        });

        peer.on('error', function(err) {
            if (err.type === 'unavailable-id') {
                initPeerPC();
            } else {
                alert("연결 오류: " + err.type);
            }
        });
    }

    // 모바일용 PeerJS
    function initPeerMobile() {
        peer = new Peer(); // 모바일은 내 ID 지정 필요 없음
    }

    // 모바일: 하단 메뉴 [PC 연결] 버튼 클릭 시
    function promptConnect() {
        const targetId = prompt("PC 화면 상단에 표시된 4자리 숫자 ID를 입력하세요:");
        if (targetId) {
            const trimmed = targetId.trim();
            if (trimmed.length !== 4 || isNaN(trimmed)) {
                return alert("4자리 숫자를 정확히 입력해 주세요.");
            }
            conn = peer.connect(trimmed);
            setupConnection();
        }
    }

    // 연결 이벤트 처리
    function setupConnection() {
        conn.on('open', function() {
            const status = document.getElementById('conn-status');
            status.innerText = "연결됨";
            status.className = "badge bg-green";

            conn.send({ type: 'SYNC', list: barcodeList });
        });

        conn.on('data', function(data) {
            if (data.type === 'ADD') {
                addBarcodeInternal(data.code);
                playBeep();
            } else if (data.type === 'SYNC') {
                barcodeList = data.list;
                saveData();
            } else if (data.type === 'REMOVE_LAST') {
                barcodeList.pop();
                saveData();
            } else if (data.type === 'CLEAR') {
                barcodeList = [];
                localStorage.removeItem('barcodes');
                renderList();
            }
        });

        conn.on('close', function() {
            const status = document.getElementById('conn-status');
            status.innerText = "끊김";
            status.className = "badge bg-red";
        });
    }

    function addBarcodeInternal(code) {
        const trimmed = code.trim();
        if (!trimmed || barcodeList.includes(trimmed)) return false;

        barcodeList.push(trimmed);
        saveData();
        return true;
    }

    function addBarcode(code) {
        const isAdded = addBarcodeInternal(code);
        if (isAdded) {
            playBeep();
            if (conn && conn.open) {
                conn.send({ type: 'ADD', code: code.trim() });
            }
        }
        return isAdded;
    }

    function removeLast() {
        if (barcodeList.length === 0) return alert("지울 내역이 없습니다.");
        barcodeList.pop();
        saveData();
        if (conn && conn.open) conn.send({ type: 'REMOVE_LAST' });
    }

    function clearAll() {
        if (barcodeList.length === 0) return;
        if (confirm("전체 내역을 삭제하시겠습니까?")) {
            barcodeList = [];
            localStorage.removeItem('barcodes');
            renderList();
            if (conn && conn.open) conn.send({ type: 'CLEAR' });
        }
    }

    function addManualBar() {
        const input = document.getElementById('manual-input');
        if (input.value) {
            const added = addBarcode(input.value);
            if (!added && input.value.trim()) alert("이미 스캔된 바코드입니다.");
            input.value = '';
            input.focus();
        }
    }

    function saveData() {
        localStorage.setItem('barcodes', JSON.stringify(barcodeList));
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('barcode-list');
        const countEl = document.getElementById('scan-count');
        
        countEl.innerText = `${barcodeList.length}건`;
        listEl.innerHTML = '';

        if (barcodeList.length === 0) {
            listEl.innerHTML = '<li class="empty-msg">내역이 없습니다.</li>';
            return;
        }

        for (let i = barcodeList.length - 1; i >= 0; i--) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${barcodeList[i]}</span><small style="color:#64748b;">#${i + 1}</small>`;
            listEl.appendChild(li);
        }
    }

    function startScanner() {
        if (html5QrcodeScanner) {
            try { html5QrcodeScanner.clear(); } catch(e) {}
        }

        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 180, height: 100 } },
            false
        );

        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    function onScanSuccess(decodedText) {
        if (isScanning) return;
        isScanning = true;

        addBarcode(decodedText);

        setTimeout(() => { isScanning = false; }, 1200);
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    // 복사 및 공유 기능 (PC일 경우 단순 클립보드 복사)
    async function copyOrShare() {
        if (barcodeList.length === 0) return alert("복사할 내역이 없습니다.");
        const text = barcodeList.join('\n');

        // 모바일이고 공유 기능을 지원하는 경우 Web Share API 실행
        if (isMobile && navigator.share) {
            try {
                await navigator.share({ title: '바코드 내역', text: text });
                return;
            } catch (err) {}
        }

        // PC 환경이거나 모바일 공유 실패 시 -> 즉시 클립보드 복사
        try {
            await navigator.clipboard.writeText(text);
            alert("클립보드에 복사되었습니다.");
        } catch (err) {
            // 구형 브라우저 대응
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert("클립보드에 복사되었습니다.");
        }
    }

    function downloadTXT() {
        if (barcodeList.length === 0) return alert("저장할 데이터가 없습니다.");
        const text = barcodeList.join('\r\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        a.href = url;
        a.download = `scan_${yy}${mm}${dd}_${hh}${min}${ss}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
