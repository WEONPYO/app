<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바코드 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f6f8;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
        }

        /* 1. 상단 유틸리티 바 */
        .top-bar {
            padding: 8px;
            background: #1e293b;
            color: white;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .top-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #334155;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .top-bar input::placeholder {
            color: #94a3b8;
        }

        /* 2. 카메라 스캔 영역 */
        .scanner-section {
            position: relative;
            background: #000;
            height: 240px; 
            flex-shrink: 0;
            overflow: hidden;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
            height: 240px !important;
        }
        
        #reader __dashboard_section {
            display: none !important;
        }

        /* 3. 컨트롤 버튼 바 (2줄 레이아웃) */
        .controls-bar {
            padding: 6px 8px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        button {
            padding: 6px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-fullscreen { background-color: #0284c7; color: white; }
        .btn-add { background-color: #2563eb; color: white; }
        .btn-restart { background-color: #6366f1; color: white; flex: 1; }
        .btn-undo { background-color: #f59e0b; color: white; flex: 1; }
        .btn-clear { background-color: #ef4444; color: white; flex: 1; }
        .btn-share { background-color: #fee500; color: #191919; flex: 1; }
        .btn-save { background-color: #10b981; color: white; flex: 1; }

        /* 4. 스캔 목록 영역 */
        .list-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
        }

        .list-header {
            padding: 6px 12px;
            background: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #334155;
            flex-shrink: 0;
        }

        .count-badge {
            background-color: #2563eb;
            color: white;
            padding: 1px 6px;
            border-radius: 10px;
        }

        ul {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        li {
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.9rem;
            animation: fadeIn 0.2s ease-in-out;
        }

        li:first-child {
            background: #eff6ff;
            border-color: #bfdbfe;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
            font-size: 0.85rem;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- 상단 입력 및 전체화면 -->
    <div class="top-bar">
        <input type="text" id="barcode-input" placeholder="바코드 직접 입력" onkeydown="handleKeyPress(event)">
        <button class="btn-add" onclick="addManualBarcode()">추가</button>
        <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ 전체화면</button>
    </div>

    <!-- 스캐너 영역 (240px) -->
    <div class="scanner-section">
        <div id="reader"></div>
    </div>

    <!-- 컨트롤 메뉴 바 -->
    <div class="controls-bar">
        <div class="btn-row">
            <button class="btn-restart" onclick="restartCamera()">📷 카메라 재시작</button>
            <button class="btn-undo" onclick="removeLastItem()">↩️ 마지막 지우기</button>
            <button class="btn-clear" onclick="clearAllData()">🗑️ 초기화</button>
        </div>
        <div class="btn-row">
            <button class="btn-share" onclick="shareData()">📋 공유</button>
            <button class="btn-save" onclick="downloadTXT()">💾 저장</button>
        </div>
    </div>

    <!-- 스크롤 목록 영역 -->
    <div class="list-container">
        <div class="list-header">
            <span>스캔 내역 (최신순)</span>
            <span class="count-badge" id="scan-count">0건</span>
        </div>
        <ul id="barcode-list">
            <li class="empty-msg">스캔된 바코드가 없습니다.</li>
        </ul>
    </div>
</div>

<script>
    let barcodeList = [];
    let html5QrcodeScanner = null;
    let isProcessing = false;

    window.onload = function() {
        loadData();
        initScanner();
    };

    function loadData() {
        const savedData = localStorage.getItem('scanned_barcodes');
        if (savedData) {
            barcodeList = JSON.parse(savedData);
            renderList();
        }
    }

    function saveData() {
        localStorage.setItem('scanned_barcodes', JSON.stringify(barcodeList));
        renderList();
    }

    function renderList() {
        const listElement = document.getElementById('barcode-list');
        const countElement = document.getElementById('scan-count');
        
        countElement.innerText = `${barcodeList.length}건`;
        listElement.innerHTML = '';

        if (barcodeList.length === 0) {
            listElement.innerHTML = '<li class="empty-msg">스캔된 바코드가 없습니다.</li>';
            return;
        }

        const total = barcodeList.length;
        for (let i = total - 1; i >= 0; i--) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${barcodeList[i]}</span><small style="color:#94a3b8;">#${i + 1}</small>`;
            listElement.appendChild(li);
        }
    }

    function addBarcode(code) {
        const trimmedCode = code.trim();
        if (!trimmedCode) return false;

        if (barcodeList.includes(trimmedCode)) {
            return false;
        }

        barcodeList.push(trimmedCode);
        saveData();
        return true;
    }

    function removeLastItem() {
        if (barcodeList.length === 0) {
            alert("지울 항목이 없습니다.");
            return;
        }
        barcodeList.pop();
        saveData();
    }

    function clearAllData() {
        if (barcodeList.length === 0) return;
        if (confirm("모든 스캔 내역을 삭제하시겠습니까?")) {
            barcodeList = [];
            localStorage.removeItem('scanned_barcodes');
            renderList();
        }
    }

    function addManualBarcode() {
        const input = document.getElementById('barcode-input');
        if (input.value) {
            const added = addBarcode(input.value);
            if (!added && input.value.trim()) {
                alert("이미 스캔된 바코드입니다.");
            }
            input.value = '';
            input.focus();
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') addManualBarcode();
    }

    function toggleFullScreen() {
        const doc = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (doc.requestFullscreen) {
                doc.requestFullscreen();
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    function initScanner() {
        if (html5QrcodeScanner) {
            try {
                html5QrcodeScanner.clear();
            } catch (e) {}
        }

        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: { width: 260, height: 160 },
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    // 카메라 재시작 기능
    function restartCamera() {
        initScanner();
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        const isAdded = addBarcode(decodedText);
        
        if (isAdded) {
            playBeep();
        }

        setTimeout(() => { isProcessing = false; }, 1200);
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    async function shareData() {
        if (barcodeList.length === 0) return alert("공유할 내역이 없습니다.");
        const textContent = barcodeList.join('\n');

        if (navigator.share) {
            try {
                await navigator.share({ title: '스캔 바코드 목록', text: textContent });
                return;
            } catch (err) {}
        }

        try {
            await navigator.clipboard.writeText(textContent);
            alert("클립보드에 복사되었습니다.");
        } catch (err) {
            alert("복사 실패");
        }
    }

    // 파일명 형식: scan_YYMMDD_HHMMSS.txt (예: scan_260830_201022.txt)
    function downloadTXT() {
        if (barcodeList.length === 0) return alert("저장할 데이터가 없습니다.");
        const textContent = barcodeList.join('\r\n');
        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        const fileName = `scan_${yy}${mm}${dd}_${hh}${min}${ss}.txt`;

        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
