<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 바코드 스캐너</title>
    <!-- 카메라 바코드 스캔 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- WebRTC 실시간 통신 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        /* 모드 선택 화면 */
        #mode-select {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 16px;
        }

        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            text-align: center;
            cursor: pointer;
        }

        .card:active { transform: scale(0.98); }
        .card h2 { color: #38bdf8; margin-bottom: 6px; }
        .card p { color: #94a3b8; font-size: 0.85rem; }

        /* 메인 앱 영역 */
        #app-view {
            display: none;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }

        /* 상단 상태 바 (글자 크기 축소) */
        .status-bar {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
        }

        .status-bar strong {
            font-size: 0.8rem;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .bg-red { background: #ef4444; color: white; }
        .bg-green { background: #10b981; color: white; }

        /* 연결 입력창 (크기 축소) */
        .connect-box {
            display: flex;
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }

        .connect-box input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-family: monospace;
            font-size: 0.78rem;
        }

        /* 카메라 영역 (기존 240px의 80%인 192px로 축소) */
        .scanner-container {
            height: 192px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
            height: 192px !important;
        }

        /* 버튼 영역 */
        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-blue { background: #0284c7; color: white; }
        .btn-indigo { background: #6366f1; color: white; flex: 1; }
        .btn-amber { background: #f59e0b; color: white; flex: 1; }
        .btn-red { background: #ef4444; color: white; flex: 1; }
        .btn-yellow { background: #fee500; color: #191919; flex: 1; }
        .btn-emerald { background: #10b981; color: white; flex: 1; }

        /* 내역 리스트 */
        .list-box {
            flex: 1;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .list-header {
            padding: 6px 10px;
            background: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        ul {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        li {
            padding: 6px 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.8rem;
        }

        li:first-child {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 0.8rem;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 초기 모드 선택 화면 -->
    <div id="mode-select">
        <h1 style="font-size: 1.2rem;">📱↔️💻 실시간 바코드 스캐너</h1>
        <div class="card" onclick="selectMode('pc')">
            <h2>💻 PC 수신 모드</h2>
            <p>모바일에서 스캔한 바코드를 실시간으로 받는 화면입니다.</p>
        </div>
        <div class="card" onclick="selectMode('mobile')">
            <h2>📱 모바일 스캔 모드</h2>
            <p>카메라로 바코드를 찍어 PC로 전송합니다.</p>
        </div>
    </div>

    <!-- 2. 메인 앱 화면 -->
    <div id="app-view">
        <div class="status-bar">
            <span>내 ID: <strong id="my-id" style="color:#38bdf8;">생성 중...</strong></span>
            <span id="conn-status" class="badge bg-red">대기</span>
        </div>

        <!-- 모바일 전용: PC 연결 입력창 -->
        <div id="connect-section" class="connect-box" style="display: none;">
            <input type="number" id="target-id" placeholder="PC ID (숫자 4자리)" pattern="\d*" oninput="if(this.value.length>4) this.value=this.value.slice(0,4)">
            <button class="btn-blue" onclick="connectToPeer()">연결</button>
        </div>

        <!-- 모바일 전용: 카메라 및 직접 입력 (위치 변경됨: 카메라 -> 수동 입력) -->
        <div id="scanner-section" style="display: none; flex-direction: column; gap: 6px;">
            <!-- 80% 크기로 변경된 카메라 -->
            <div class="scanner-container">
                <div id="reader"></div>
            </div>
            <!-- 카메라 하단으로 이동한 수동 입력창 -->
            <div class="connect-box">
                <input type="text" id="manual-input" placeholder="바코드 직접 입력" onkeydown="if(event.key==='Enter') addManualBar()">
                <button class="btn-blue" onclick="addManualBar()">추가</button>
            </div>
        </div>

        <!-- 버튼 메뉴 -->
        <div class="btn-group">
            <button id="btn-restart" class="btn-indigo" onclick="startScanner()" style="display:none;">📷 카메라 재시작</button>
            <button class="btn-amber" onclick="removeLast()">↩️ 지우기</button>
            <button class="btn-red" onclick="clearAll()">🗑️ 초기화</button>
        </div>
        <div class="btn-group">
            <button class="btn-yellow" onclick="shareData()">📋 복사/공유</button>
            <button class="btn-emerald" onclick="downloadTXT()">💾 txt 저장</button>
        </div>

        <!-- 스캔 리스트 -->
        <div class="list-box">
            <div class="list-header">
                <span>스캔 내역 (최신순)</span>
                <span id="scan-count" style="background:#0284c7; padding:1px 6px; border-radius:10px;">0건</span>
            </div>
            <ul id="barcode-list">
                <li class="empty-msg">내역이 없습니다.</li>
            </ul>
        </div>
    </div>
</div>

<script>
    let mode = ''; 
    let peer = null;
    let conn = null;
    let barcodeList = [];
    let html5QrcodeScanner = null;
    let isScanning = false;

    window.onload = function() {
        const saved = localStorage.getItem('barcodes');
        if (saved) {
            barcodeList = JSON.parse(saved);
        }
    };

    function selectMode(selectedMode) {
        mode = selectedMode;
        document.getElementById('mode-select').style.display = 'none';
        document.getElementById('app-view').style.display = 'flex';

        renderList();
        initPeer();

        if (mode === 'mobile') {
            document.getElementById('connect-section').style.display = 'flex';
            document.getElementById('scanner-section').style.display = 'flex';
            document.getElementById('btn-restart').style.display = 'block';
            startScanner();
        }
    }

    // P2P 통신 초기화 (4자리 숫자 ID 생성)
    function initPeer() {
        const numId = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(numId);

        peer.on('open', function(id) {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', function(c) {
            conn = c;
            setupConnection();
        });

        peer.on('error', function(err) {
            // 숫자 4자리 충돌 시 재시도
            if (err.type === 'unavailable-id') {
                initPeer();
            } else {
                alert("연결 오류: " + err.type);
            }
        });
    }

    function connectToPeer() {
        const targetId = document.getElementById('target-id').value.trim();
        if (!targetId || targetId.length !== 4) return alert("PC 화면의 4자리 숫자 ID를 입력하세요.");

        conn = peer.connect(targetId);
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', function() {
            const status = document.getElementById('conn-status');
            status.innerText = "연결됨";
            status.className = "badge bg-green";

            conn.send({ type: 'SYNC', list: barcodeList });
        });

        conn.on('data', function(data) {
            if (data.type === 'ADD') {
                addBarcodeInternal(data.code);
                playBeep();
            } else if (data.type === 'SYNC') {
                barcodeList = data.list;
                saveData();
            } else if (data.type === 'REMOVE_LAST') {
                barcodeList.pop();
                saveData();
            } else if (data.type === 'CLEAR') {
                barcodeList = [];
                localStorage.removeItem('barcodes');
                renderList();
            }
        });

        conn.on('close', function() {
            const status = document.getElementById('conn-status');
            status.innerText = "끊김";
            status.className = "badge bg-red";
        });
    }

    function addBarcodeInternal(code) {
        const trimmed = code.trim();
        if (!trimmed || barcodeList.includes(trimmed)) return false;

        barcodeList.push(trimmed);
        saveData();
        return true;
    }

    function addBarcode(code) {
        const isAdded = addBarcodeInternal(code);
        if (isAdded) {
            playBeep();
            if (conn && conn.open) {
                conn.send({ type: 'ADD', code: code.trim() });
            }
        }
        return isAdded;
    }

    function removeLast() {
        if (barcodeList.length === 0) return alert("지울 내역이 없습니다.");
        barcodeList.pop();
        saveData();
        if (conn && conn.open) conn.send({ type: 'REMOVE_LAST' });
    }

    function clearAll() {
        if (barcodeList.length === 0) return;
        if (confirm("전체 내역을 삭제하시겠습니까?")) {
            barcodeList = [];
            localStorage.removeItem('barcodes');
            renderList();
            if (conn && conn.open) conn.send({ type: 'CLEAR' });
        }
    }

    function addManualBar() {
        const input = document.getElementById('manual-input');
        if (input.value) {
            const added = addBarcode(input.value);
            if (!added && input.value.trim()) alert("이미 스캔된 바코드입니다.");
            input.value = '';
            input.focus();
        }
    }

    function saveData() {
        localStorage.setItem('barcodes', JSON.stringify(barcodeList));
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('barcode-list');
        const countEl = document.getElementById('scan-count');
        
        countEl.innerText = `${barcodeList.length}건`;
        listEl.innerHTML = '';

        if (barcodeList.length === 0) {
            listEl.innerHTML = '<li class="empty-msg">내역이 없습니다.</li>';
            return;
        }

        for (let i = barcodeList.length - 1; i >= 0; i--) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${barcodeList[i]}</span><small style="color:#64748b;">#${i + 1}</small>`;
            listEl.appendChild(li);
        }
    }

    function startScanner() {
        if (html5QrcodeScanner) {
            try { html5QrcodeScanner.clear(); } catch(e) {}
        }

        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 180, height: 100 } },
            false
        );

        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    function onScanSuccess(decodedText) {
        if (isScanning) return;
        isScanning = true;

        addBarcode(decodedText);

        setTimeout(() => { isScanning = false; }, 1200);
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    async function shareData() {
        if (barcodeList.length === 0) return alert("공유할 내역이 없습니다.");
        const text = barcodeList.join('\n');

        if (navigator.share) {
            try {
                await navigator.share({ title: '바코드 내역', text: text });
                return;
            } catch (err) {}
        }

        try {
            await navigator.clipboard.writeText(text);
            alert("클립보드에 복사되었습니다.");
        } catch (err) {
            alert("복사 실패");
        }
    }

    function downloadTXT() {
        if (barcodeList.length === 0) return alert("저장할 데이터가 없습니다.");
        const text = barcodeList.join('\r\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        a.href = url;
        a.download = `scan_${yy}${mm}${dd}_${hh}${min}${ss}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
