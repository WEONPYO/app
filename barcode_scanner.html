<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 바코드 스캐너</title>
    <!-- 바코드 스캔 엔진 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- WebRTC 실시간 통신 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        /* 상단 상태 바 */
        .status-bar {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .bg-red { background: #ef4444; color: white; }
        .bg-green { background: #10b981; color: white; }
        .bg-yellow { background: #f59e0b; color: white; }

        /* 카메라 스캐너 영역 */
        .scanner-container {
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        /* Zoom 컨트롤 바 */
        .zoom-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #38bdf8;
        }

        .zoom-box input {
            flex: 1;
            accent-color: #0284c7;
        }

        /* 수동 입력창 */
        .input-box {
            display: flex;
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }

        .input-box input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-family: monospace;
            font-size: 0.8rem;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-blue { background: #0284c7; color: white; }
        .btn-sky { background: #0ea5e9; color: white; flex: 1; }
        .btn-indigo { background: #6366f1; color: white; flex: 1; }
        .btn-amber { background: #f59e0b; color: white; flex: 1; }
        .btn-red { background: #ef4444; color: white; flex: 1; }
        .btn-yellow { background: #fee500; color: #191919; flex: 1; }
        .btn-emerald { background: #10b981; color: white; flex: 1; }

        /* 내역 리스트 영역 */
        .list-box {
            flex: 1;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0; /* flex 자식 스크롤 허용 */
        }

        .list-header {
            padding: 6px 10px;
            background: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        ul {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        li {
            padding: 6px 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.8rem;
        }

        li:first-child {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: bold;
        }

        li.is-duplicate {
            background: #450a0a !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 0.8rem;
            border: none;
            background: transparent;
        }

        /* 하단 버전 고정 표시 */
        .version-tag {
            text-align: center;
            font-size: 0.65rem;
            color: #64748b;
            padding: 4px 0 2px 0;
            flex-shrink: 0;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 상태 바 -->
    <div class="status-bar">
        <span id="mode-badge" style="font-weight: bold; color: #38bdf8;">모드 감지 중...</span>
        <span id="pc-id-area" style="display: none;">PC ID: <strong id="my-id" style="color:#f59e0b; font-size: 0.85rem;">----</strong></span>
        <span id="conn-status" class="badge bg-red">대기</span>
    </div>

    <!-- 카메라 스캔 영역 (모바일) -->
    <div id="scanner-section" style="display: none; flex-direction: column; gap: 4px; flex-shrink: 0;">
        <div class="scanner-container">
            <div id="reader"></div>
        </div>
        <!-- 줌 컨트롤러 -->
        <div class="zoom-box" id="zoom-area" style="display: none;">
            <span>🔍 줌</span>
            <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="changeZoom(this.value)">
            <span id="zoom-value">1.0x</span>
        </div>
        <!-- 수동 입력 -->
        <div class="input-box">
            <input type="text" id="manual-input" placeholder="바코드 직접 입력" onkeydown="if(event.key==='Enter') addManualBar()">
            <button class="btn-blue" onclick="addManualBar()">추가</button>
        </div>
    </div>

    <!-- 버튼 메뉴 -->
    <div class="btn-group">
        <button id="btn-connect" class="btn-sky" onclick="promptConnect()" style="display:none;">🔗 PC 연결</button>
        <button id="btn-restart" class="btn-indigo" onclick="initCamera()" style="display:none;">📷 카메라 재시작</button>
        <button class="btn-amber" onclick="removeLast()">↩️ 지우기</button>
        <button class="btn-red" onclick="clearAll()">🗑️ 초기화</button>
    </div>
    <div class="btn-group">
        <button class="btn-yellow" onclick="copyOrShare()">📋 복사</button>
        <button class="btn-emerald" onclick="downloadTXT()">💾 txt 저장</button>
    </div>

    <!-- 스캔 리스트 -->
    <div class="list-box">
        <div class="list-header">
            <span>스캔 내역 (최신순)</span>
            <span id="scan-count" style="background:#0284c7; padding:1px 6px; border-radius:10px;">0건</span>
        </div>
        <ul id="barcode-list">
            <li class="empty-msg">내역이 없습니다.</li>
        </ul>
    </div>

    <!-- 최하단 버전 표기 -->
    <div class="version-tag">v26083101</div>
</div>

<script>
    let isMobile = false;
    let peer = null;
    let conn = null;
    let barcodeList = [];
    let html5QrCode = null;
    let videoTrack = null;
    let isScanning = false;

    // WebRTC STUN 서버 설정
    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };

    window.onload = function() {
        const saved = localStorage.getItem('barcodes');
        if (saved) {
            try { barcodeList = JSON.parse(saved); } catch(e) {}
        }
        renderList();

        isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
            document.getElementById('mode-badge').innerText = "📱 모바일 스캔 모드";
            document.getElementById('scanner-section').style.display = 'flex';
            document.getElementById('btn-connect').style.display = 'block';
            document.getElementById('btn-restart').style.display = 'block';
            
            initPeerMobile();
            initCamera();
        } else {
            document.getElementById('mode-badge').innerText = "💻 PC 수신 모드";
            document.getElementById('pc-id-area').style.display = 'inline';
            
            initPeerPC();
        }
    };

    /* PC Peer 초기화 (4자리 ID 생성) */
    function initPeerPC() {
        const numId = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(numId, peerConfig);

        peer.on('open', function(id) {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', function(c) {
            conn = c;
            setupConnection();
        });

        peer.on('error', function(err) {
            if (err.type === 'unavailable-id') {
                initPeerPC();
            } else {
                updateStatus("오류", "bg-red");
            }
        });
    }

    /* 모바일 Peer 초기화 */
    function initPeerMobile() {
        peer = new Peer(peerConfig);
    }

    function promptConnect() {
        const targetId = prompt("PC 화면 상단의 4자리 숫자 ID를 입력하세요:");
        if (targetId) {
            const trimmed = targetId.trim();
            if (trimmed.length !== 4 || isNaN(trimmed)) {
                return alert("4자리 숫자를 입력해 주세요.");
            }
            updateStatus("연동 중", "bg-yellow");
            if (conn) conn.close();
            conn = peer.connect(trimmed, { reliable: true });
            setupConnection();
        }
    }

    function setupConnection() {
        conn.on('open', function() {
            updateStatus("연결됨", "bg-green");

            // 최초 연결 시 모바일 기준 동기화
            if (isMobile) {
                conn.send({ type: 'SYNC', list: barcodeList });
            }
        });

        conn.on('data', function(data) {
            if (data.type === 'ADD') {
                addBarcodeInternal(data.code);
            } else if (data.type === 'SYNC') {
                barcodeList = data.list;
                saveData();
            } else if (data.type === 'REMOVE_LAST') {
                barcodeList.pop();
                saveData();
            } else if (data.type === 'CLEAR') {
                barcodeList = [];
                localStorage.removeItem('barcodes');
                renderList();
            }
        });

        conn.on('close', function() {
            updateStatus("끊김", "bg-red");
        });
    }

    function updateStatus(text, bgClass) {
        const el = document.getElementById('conn-status');
        el.innerText = text;
        el.className = `badge ${bgClass}`;
    }

    /* 모바일 고화질 카메라 및 Zoom 제어 */
    async function initCamera() {
        if (html5QrCode) {
            try { await html5QrCode.stop(); } catch(e) {}
            html5QrCode = null;
        }

        document.getElementById('reader').innerHTML = '';
        html5QrCode = new Html5Qrcode("reader", { experimentalFeatures: { willReadFrequently: true } });

        const config = {
            fps: 25,
            aspectRatio: 1.0
        };

        try {
            await html5QrCode.start(
                { facingMode: { exact: "environment" } },
                config,
                onScanSuccess
            );
            setupZoomControl();
        } catch (err) {
            // 후면 카메라 실패 시 기본 카메라 시도
            try {
                await html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
                setupZoomControl();
            } catch(e) {
                alert("카메라 권한을 확인해주세요.");
            }
        }
    }

    /* 카메라 하드웨어 Zoom 적용 */
    function setupZoomControl() {
        setTimeout(() => {
            const videoEl = document.querySelector("#reader video");
            if (videoEl && videoEl.srcObject) {
                videoTrack = videoEl.srcObject.getVideoTracks()[0];
                if (videoTrack && videoTrack.getCapabilities) {
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.zoom) {
                        const zoomArea = document.getElementById('zoom-area');
                        const zoomSlider = document.getElementById('zoom-slider');
                        zoomArea.style.display = 'flex';
                        zoomSlider.min = capabilities.zoom.min || 1;
                        zoomSlider.max = Math.min(capabilities.zoom.max || 5, 5);
                        zoomSlider.step = capabilities.zoom.step || 0.1;
                        zoomSlider.value = 1;
                    }
                }
            }
        }, 800);
    }

    function changeZoom(val) {
        document.getElementById('zoom-value').innerText = `${parseFloat(val).toFixed(1)}x`;
        if (videoTrack) {
            videoTrack.applyConstraints({
                advanced: [{ zoom: parseFloat(val) }]
            }).catch(e => console.log(e));
        }
    }

    function onScanSuccess(decodedText) {
        if (isScanning) return;
        isScanning = true;

        addBarcode(decodedText);

        setTimeout(() => { isScanning = false; }, 1000);
    }

    function addBarcodeInternal(code) {
        const trimmed = code.trim();
        if (!trimmed) return false;

        if (barcodeList.length > 0 && barcodeList[barcodeList.length - 1] === trimmed) {
            playErrorBeep();
            return false;
        }

        barcodeList.push(trimmed);
        playBeep();
        saveData();
        return true;
    }

    function addBarcode(code) {
        const isAdded = addBarcodeInternal(code);
        if (isAdded && conn && conn.open) {
            conn.send({ type: 'ADD', code: code.trim() });
        }
        return isAdded;
    }

    function removeLast() {
        if (barcodeList.length === 0) return alert("지울 내역이 없습니다.");
        barcodeList.pop();
        saveData();
        if (conn && conn.open) conn.send({ type: 'REMOVE_LAST' });
    }

    function clearAll() {
        if (barcodeList.length === 0) return;
        if (confirm("전체 내역을 삭제하시겠습니까?")) {
            barcodeList = [];
            localStorage.removeItem('barcodes');
            renderList();
            if (conn && conn.open) conn.send({ type: 'CLEAR' });
        }
    }

    function addManualBar() {
        const input = document.getElementById('manual-input');
        if (input.value) {
            addBarcode(input.value);
            input.value = '';
            input.focus();
        }
    }

    function saveData() {
        localStorage.setItem('barcodes', JSON.stringify(barcodeList));
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('barcode-list');
        const countEl = document.getElementById('scan-count');
        
        countEl.innerText = `${barcodeList.length}건`;
        listEl.innerHTML = '';

        if (barcodeList.length === 0) {
            listEl.innerHTML = '<li class="empty-msg">내역이 없습니다.</li>';
            return;
        }

        const counts = {};
        barcodeList.forEach(code => {
            counts[code] = (counts[code] || 0) + 1;
        });

        for (let i = barcodeList.length - 1; i >= 0; i--) {
            const code = barcodeList[i];
            const li = document.createElement('li');
            
            if (counts[code] > 1) {
                li.classList.add('is-duplicate');
            }

            li.innerHTML = `<span>${code}</span><small style="opacity: 0.7;">#${i + 1}</small>`;
            listEl.appendChild(li);
        }
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    function playErrorBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sawtooth";
            osc.frequency.value = 400;
            gain.gain.value = 0.15;
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    async function copyOrShare() {
        if (barcodeList.length === 0) return alert("복사할 내역이 없습니다.");
        const text = barcodeList.join('\n');

        if (isMobile && navigator.share) {
            try {
                await navigator.share({ title: '바코드 내역', text: text });
                return;
            } catch (err) {}
        }

        navigator.clipboard.writeText(text).then(() => {
            alert("클립보드에 복사되었습니다.");
        });
    }

    function downloadTXT() {
        if (barcodeList.length === 0) return alert("저장할 데이터가 없습니다.");
        const text = barcodeList.join('\r\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');

        a.href = url;
        a.download = `scan_${yy}${mm}${dd}_${hh}${min}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
