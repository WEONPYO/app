<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프리미엄 3D 원형 룰렛 추첨기</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-gold: #f59e0b;
      --accent-gold-light: #fbbf24;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      color: var(--accent-gold);
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .btn-config, .btn-reset {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-config:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .btn-reset:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* 메인 콘텐츠 레이아웃 */
    .main-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    @media (min-width: 768px) or (orientation: landscape) and (max-height: 500px) {
      .main-wrapper {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    .roulette-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
    }

    .roulette-outer-ring {
      position: relative;
      padding: 12px;
      background: radial-gradient(circle, #382314 0%, #1a0f07 70%, #0a0502 100%);
      border-radius: 50%;
      box-shadow: 0 0 0 3px #b8860b, 0 0 0 6px #5c4033, inset 0 0 15px rgba(0,0,0,0.9);
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #f59e0b;
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.7));
    }

    canvas {
      border-radius: 50%;
      display: block;
      width: 280px;
      height: 280px;
    }

    @media (max-height: 500px) and (orientation: landscape) {
      canvas {
        width: 200px;
        height: 200px;
      }
      .roulette-card {
        padding: 10px;
      }
    }

    #resultDisplay {
      margin-top: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      text-align: center;
      min-height: 2.2em;
      color: #38bdf8;
      word-break: keep-all;
    }

    /* 단일 뽑기 하단 번호별 메모 표시 영역 */
    .single-info-box {
      width: 100%;
      margin-top: 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .single-info-header {
      color: var(--accent-gold-light);
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .info-summary-tags {
      display: flex;
      gap: 6px;
    }

    .info-badge {
      background: #334155;
      color: var(--text-light);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: normal;
    }

    .memo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .memo-card-item {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .memo-card-num {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .memo-card-text {
      font-size: 0.75rem;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .control-box {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-light);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    button.btn-spin {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      transition: all 0.2s;
    }

    button.btn-spin:active {
      transform: scale(0.98);
    }

    /* 현황 카드 */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      flex: 1;
      max-height: 480px;
      display: flex;
      flex-direction: column;
    }

    .status-card h2 {
      font-size: 1rem;
      color: var(--accent-gold-light);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 380px;
      padding-right: 4px;
    }

    .team-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
    }

    .team-item-title {
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .member-tag {
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .member-order {
      color: var(--accent-gold-light);
      font-size: 0.7rem;
      font-weight: bold;
      margin-right: 4px;
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .modal-header h3 {
      color: var(--accent-gold);
      font-size: 1.1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-light);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .sub-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .btn-apply {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .memo-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .memo-item label {
      min-width: 45px;
      font-size: 0.8rem;
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>🎡 룰렛 추첨기</h1>
  <div class="header-btns">
    <button class="btn-reset" onclick="resetRoulette()">🔄 초기화</button>
    <button class="btn-config" onclick="openModal()">⚙️ 추첨 설정</button>
  </div>
</header>

<div class="main-wrapper">
  <!-- 룰렛 보드 영역 -->
  <div class="roulette-card">
    <div class="roulette-outer-ring">
      <div class="pointer"></div>
      <canvas id="rouletteCanvas" width="280" height="280"></canvas>
    </div>

    <div class="control-box">
      <div id="currentPlayerBox" style="display: none;">
        <input type="text" id="currentPlayerName" placeholder="뽑을 사람 이름 입력 (선택)">
      </div>
      <button id="spinBtn" class="btn-spin" onclick="spin()">SPIN!</button>
    </div>

    <div id="resultDisplay">버튼을 눌러 추첨을 시작하세요!</div>

    <!-- 단일 뽑기 하단 번호별 메모 표시 박스 -->
    <div id="singleInfoBox" class="single-info-box" style="display: none;">
      <div class="single-info-header">
        <span>📝 번호별 설정 메모</span>
        <div class="info-summary-tags">
          <span class="info-badge" id="infoRange">1~10번</span>
          <span class="info-badge" id="infoDuplicate">중복미허용</span>
        </div>
      </div>
      <div id="memoGrid" class="memo-grid"></div>
    </div>
  </div>

  <!-- 결과 현황 카드 -->
  <div class="status-card" id="statusCard">
    <h2 id="statusTitle">📊 팀별 배치 현황</h2>
    <div class="team-grid" id="statusGrid"></div>
  </div>
</div>

<!-- 설정 모달 팝업 -->
<div class="modal-overlay" id="configModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>⚙️ 상세 설정</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>

    <div class="form-group">
      <label for="modeSelect">추첨 모드</label>
      <select id="modeSelect" onchange="toggleModeUI()">
        <option value="single">단일 번호 뽑기</option>
        <option value="team">팀 배치 뽑기</option>
      </select>
    </div>

    <!-- 단일 번호 설정 -->
    <div id="singleConfig">
      <div class="form-group">
        <label for="allowDuplicate">중복 추출 옵션</label>
        <select id="allowDuplicate">
          <option value="false">중복 미허용 (유일 번호 / 당첨 시 삭제)</option>
          <option value="true">중복 허용 (동일 번호 연속 추첨 가능)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="minNum">시작 번호</label>
        <input type="number" id="minNum" value="1" onchange="generateMemoInputs()">
      </div>
      <div class="form-group">
        <label for="maxNum">끝 번호</label>
        <input type="number" id="maxNum" value="10" onchange="generateMemoInputs()">
      </div>

      <div class="form-group">
        <label>📝 번호별 메모 설정</label>
        <div id="memoInputs" style="max-height: 120px; overflow-y: auto; padding-right: 4px;"></div>
      </div>
    </div>

    <!-- 팀 뽑기 설정 -->
    <div id="teamConfig" style="display: none;">
      <div class="form-group">
        <label for="teamCount">생성할 팀 개수</label>
        <input type="number" id="teamCount" value="4" min="2">
      </div>
      <div class="form-group">
        <label for="totalSlots">전체 인원 수 (총 추첨 횟수)</label>
        <input type="number" id="totalSlots" value="12" min="2">
        <div class="sub-text">※ 입력한 인원 수만큼 무작위(랜덤) 배치된 조각이 생성됩니다.</div>
      </div>
    </div>

    <button class="btn-apply" onclick="applySettings()">설정 저장 및 적용</button>
  </div>
</div>

<script>
  // 오디오 효과음
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
  }

  function playTick() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    } catch(e){}
  }

  function playFanfare() {
    try {
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.25);
      });
    } catch(e){}
  }

  let state = {
    mode: 'single',
    allowDuplicate: false,
    minNum: 1,
    maxNum: 10,
    teamCount: 4,
    totalSlots: 12,
    remainingItems: [],
    teams: {},
    history: [],
    numberMemos: {}
  };

  let isSpinning = false;
  const canvas = document.getElementById('rouletteCanvas');
  const ctx = canvas.getContext('2d');

  const colorPalette = [
    ['#e11d48', '#be123c'], ['#2563eb', '#1d4ed8'],
    ['#059669', '#047857'], ['#d97706', '#b45309'],
    ['#7c3aed', '#6d28d9'], ['#0891b2', '#0e7490']
  ];

  window.onload = function() {
    loadState();
    drawRoulette();
    updateStatusBoard();
    updateSingleInfoDisplay();
  };

  function openModal() {
    document.getElementById('configModal').style.display = 'flex';
    generateMemoInputs();
  }

  function closeModal() {
    document.getElementById('configModal').style.display = 'none';
  }

  function toggleModeUI() {
    const mode = document.getElementById('modeSelect').value;
    document.getElementById('singleConfig').style.display = mode === 'single' ? 'block' : 'none';
    document.getElementById('teamConfig').style.display = mode === 'team' ? 'block' : 'none';
    document.getElementById('currentPlayerBox').style.display = mode === 'team' ? 'block' : 'none';
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateMemoInputs() {
    const min = parseInt(document.getElementById('minNum').value) || 1;
    const max = parseInt(document.getElementById('maxNum').value) || 10;
    const box = document.getElementById('memoInputs');
    box.innerHTML = '';

    for (let i = min; i <= max; i++) {
      const val = state.numberMemos[i] || '';
      box.innerHTML += `
        <div class="memo-item">
          <label>${i}번:</label>
          <input type="text" class="memo-input" data-num="${i}" value="${val}" placeholder="메모 내용">
        </div>
      `;
    }
  }

  function updateSingleInfoDisplay() {
    const infoBox = document.getElementById('singleInfoBox');
    if (state.mode !== 'single') {
      infoBox.style.display = 'none';
      return;
    }

    infoBox.style.display = 'block';
    document.getElementById('infoRange').innerText = `${state.minNum}~${state.maxNum}번`;
    document.getElementById('infoDuplicate').innerText = state.allowDuplicate ? '중복허용' : '중복미허용';

    const grid = document.getElementById('memoGrid');
    grid.innerHTML = '';

    for (let i = state.minNum; i <= state.maxNum; i++) {
      const memoText = state.numberMemos[i] && state.numberMemos[i].trim() !== '' 
        ? state.numberMemos[i] 
        : '(메모 없음)';

      grid.innerHTML += `
        <div class="memo-card-item">
          <span class="memo-card-num">${i}번</span>
          <span class="memo-card-text" title="${memoText}">${memoText}</span>
        </div>
      `;
    }
  }

  function resetRoulette() {
    if (isSpinning) return;
    if (!confirm('추첨 내역과 진행 상황을 모두 초기화하시겠습니까?')) return;

    if (state.mode === 'single') {
      let items = [];
      for (let i = state.minNum; i <= state.maxNum; i++) items.push(i);
      state.remainingItems = shuffle(items);
    } else {
      let items = [];
      for (let i = 0; i < state.totalSlots; i++) {
        items.push((i % state.teamCount) + 1);
      }
      state.remainingItems = shuffle(items);

      state.teams = {};
      for (let i = 1; i <= state.teamCount; i++) state.teams[i] = [];
    }

    state.history = [];
    saveState();
    drawRoulette();
    updateStatusBoard();
    updateSingleInfoDisplay();
    document.getElementById('resultDisplay').innerText = '초기화되었습니다. 다시 추첨할 수 있습니다!';
  }

  function applySettings() {
    state.mode = document.getElementById('modeSelect').value;

    if (state.mode === 'single') {
      state.allowDuplicate = document.getElementById('allowDuplicate').value === 'true';
      state.minNum = parseInt(document.getElementById('minNum').value) || 1;
      state.maxNum = parseInt(document.getElementById('maxNum').value) || 10;
      
      document.querySelectorAll('.memo-input').forEach(inp => {
        state.numberMemos[inp.dataset.num] = inp.value;
      });

      let items = [];
      for (let i = state.minNum; i <= state.maxNum; i++) items.push(i);
      state.remainingItems = shuffle(items);
    } else {
      state.teamCount = parseInt(document.getElementById('teamCount').value) || 2;
      state.totalSlots = parseInt(document.getElementById('totalSlots').value) || 2;
      
      let items = [];
      for (let i = 0; i < state.totalSlots; i++) {
        items.push((i % state.teamCount) + 1);
      }
      state.remainingItems = shuffle(items);
      
      state.teams = {};
      for (let i = 1; i <= state.teamCount; i++) state.teams[i] = [];
    }

    state.history = [];
    saveState();
    drawRoulette();
    updateStatusBoard();
    updateSingleInfoDisplay();
    toggleModeUI();
    closeModal();
    document.getElementById('resultDisplay').innerText = '설정이 적용되었습니다!';
  }

  function drawRoulette() {
    const list = state.remainingItems;
    const num = list.length;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = cx - 6;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (num === 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('추첨 완료', cx, cy);
      return;
    }

    const arc = (2 * Math.PI) / num;

    for (let i = 0; i < num; i++) {
      const angle = i * arc;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + arc);
      ctx.lineTo(cx, cy);

      const colors = colorPalette[i % colorPalette.length];
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.stroke();

      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.translate(cx, cy);
      ctx.rotate(angle + arc / 2);
      ctx.textAlign = 'right';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(state.mode === 'team' ? `${list[i]}팀` : `${list[i]}`, r - 12, 4);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
  }

  function spin() {
    if (isSpinning) return;
    if (state.remainingItems.length === 0) {
      alert('더 이상 추첨할 항목이 없습니다. 상단 초기화 버튼을 누르거나 설정에서 다시 적용해주세요.');
      return;
    }

    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('resultDisplay').innerText = '🎰 회전 중...';

    const list = state.remainingItems;
    const selectedIdx = Math.floor(Math.random() * list.length);
    const selectedValue = list[selectedIdx];

    const arcDeg = 360 / list.length;
    const targetDeg = 360 - (selectedIdx * arcDeg + arcDeg / 2) - 90;
    const totalDeg = 360 * 5 + targetDeg;

    let elapsed = 0;
    const duration = 4000;
    
    function tickLoop() {
      if (elapsed < duration) {
        playTick();
        let step = 40 + Math.pow(elapsed / duration, 3) * 300;
        elapsed += step;
        setTimeout(tickLoop, step);
      }
    }
    tickLoop();

    canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';
    canvas.style.transform = `rotate(${totalDeg}deg)`;

    const nameInput = document.getElementById('currentPlayerName');
    const nameVal = nameInput ? nameInput.value.trim() : '';

    setTimeout(() => {
      canvas.style.transition = 'none';
      canvas.style.transform = `rotate(${targetDeg}deg)`;
      playFanfare();

      if (state.mode === 'team') {
        const orderNum = state.history.length + 1; // 전체 추첨 순서 번호
        const displayName = nameVal ? nameVal : `${orderNum}번째`;
        
        const text = nameVal 
          ? `🎉 [ ${nameVal} ] ➡️ ${selectedValue}번 팀 (${orderNum}번째 추첨)` 
          : `🎉 당첨: [ ${selectedValue}번 팀 ] (${orderNum}번째)`;
        
        document.getElementById('resultDisplay').innerText = text;
        
        // 팀 데이터 구조에 순서(order)와 이름(name) 함께 저장
        state.teams[selectedValue].push({
          order: orderNum,
          name: displayName
        });
        
        state.history.push({ team: selectedValue, name: displayName, order: orderNum });
        state.remainingItems.splice(selectedIdx, 1);
      } else {
        const memo = state.numberMemos[selectedValue] ? ` (${state.numberMemos[selectedValue]})` : '';
        document.getElementById('resultDisplay').innerText = `🎉 당첨: [ ${selectedValue}번${memo} ]`;
        state.history.push(selectedValue);
        if (!state.allowDuplicate) {
          state.remainingItems.splice(selectedIdx, 1);
        }
      }

      if (nameInput) nameInput.value = '';
      saveState();
      updateStatusBoard();
      drawRoulette();

      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, duration);
  }

  function updateStatusBoard() {
    const grid = document.getElementById('statusGrid');
    const title = document.getElementById('statusTitle');
    grid.innerHTML = '';

    if (state.mode === 'team') {
      title.innerText = '📊 팀별 인원 배치 현황';
      for (let teamId in state.teams) {
        const members = state.teams[teamId];
        let tags = members.map(m => {
          // 객체 데이터 또는 하위 호환성 문자열 처리
          const orderStr = typeof m === 'object' ? `${m.order}번째` : '배치됨';
          const nameStr = typeof m === 'object' ? m.name : m;
          return `
            <div class="member-tag">
              <span class="member-order">[${orderStr}]</span>
              <span>${nameStr}</span>
            </div>
          `;
        }).join('');
        
        if (!members.length) tags = '<div style="color:var(--text-muted); font-size:0.75rem; text-align:center; padding:4px;">미배치</div>';

        grid.innerHTML += `
          <div class="team-item">
            <div class="team-item-title"><span>${teamId}팀</span> <span>${members.length}명</span></div>
            <div class="member-list">${tags}</div>
          </div>
        `;
      }
    } else {
      title.innerText = '📜 당첨 이력';
      if (!state.history.length) {
        grid.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">당첨 내역이 없습니다.</div>';
        return;
      }
      let tags = state.history.map((num, i) => {
        const memo = state.numberMemos[num] ? ` (${state.numberMemos[num]})` : '';
        return `
          <div class="member-tag">
            <span class="member-order">${i+1}회</span>
            <span>${num}번${memo}</span>
          </div>
        `;
      }).join('');
      grid.innerHTML = `<div class="member-list">${tags}</div>`;
    }
  }

  function saveState() {
    localStorage.setItem('rouletteConfig3D_v10', JSON.stringify(state));
  }

  function loadState() {
    const saved = localStorage.getItem('rouletteConfig3D_v10');
    if (saved) {
      try {
        state = JSON.parse(saved);
        document.getElementById('modeSelect').value = state.mode || 'single';
        document.getElementById('allowDuplicate').value = state.allowDuplicate ? 'true' : 'false';
        document.getElementById('minNum').value = state.minNum || 1;
        document.getElementById('maxNum').value = state.maxNum || 10;
        document.getElementById('teamCount').value = state.teamCount || 4;
        document.getElementById('totalSlots').value = state.totalSlots || 12;
        toggleModeUI();
      } catch (e) {
        applySettings();
      }
    } else {
      applySettings();
    }
  }
</script>
